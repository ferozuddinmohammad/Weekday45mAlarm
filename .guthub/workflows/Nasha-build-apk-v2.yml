          package com.example.nasha

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import java.time.LocalDate
          import java.time.LocalDateTime
          import java.time.LocalTime
          import java.time.ZoneId

          object AlarmScheduler {
              private const val THYROID_REQ_CODE = 1001
              private const val WATER_REQ_CODE = 1002
              private const val CUSTOM_REQ_CODE = 1003

              private val WATER_START = LocalTime.of(10, 0)
              private val WATER_END = LocalTime.of(20, 0)
              private const val WATER_INTERVAL_MINS = 45L

              fun scheduleThyroidAlarm(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !am.canScheduleExactAlarms()) return

                  val now = LocalDateTime.now()
                  var target = LocalDate.now().atTime(6, 55)
                  if (!target.isAfter(now)) {
                      target = target.plusDays(1)
                  }
                  val triggerMillis = target.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()

                  val intent = Intent(context, AlarmReceiver::class.java).apply {
                      putExtra("ALARM_TYPE", "THYROID")
                  }
                  val pi = PendingIntent.getBroadcast(
                      context, THYROID_REQ_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.setAlarmClock(AlarmManager.AlarmClockInfo(triggerMillis, pi), pi)

                  context.getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                      .edit()
                      .putBoolean("thyroid_enabled", true)
                      .putLong("thyroid_next", triggerMillis)
                      .apply()
              }

              fun cancelThyroidAlarm(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val pi = PendingIntent.getBroadcast(
                      context, THYROID_REQ_CODE, Intent(context, AlarmReceiver::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.cancel(pi)
                  context.getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                      .edit().putBoolean("thyroid_enabled", false).apply()
              }

              fun scheduleNextWaterAlarm(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !am.canScheduleExactAlarms()) return

                  val nextSlot = calculateNextWaterSlot(LocalDateTime.now())
                  val triggerMillis = nextSlot.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()

                  val intent = Intent(context, AlarmReceiver::class.java).apply {
                      putExtra("ALARM_TYPE", "WATER")
                  }
                  val pi = PendingIntent.getBroadcast(
                      context, WATER_REQ_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.setAlarmClock(AlarmManager.AlarmClockInfo(triggerMillis, pi), pi)

                  context.getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                      .edit()
                      .putBoolean("water_enabled", true)
                      .putLong("water_next", triggerMillis)
                      .apply()
              }

              fun cancelWaterAlarm(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val pi = PendingIntent.getBroadcast(
                      context, WATER_REQ_CODE, Intent(context, AlarmReceiver::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.cancel(pi)
                  context.getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                      .edit().putBoolean("water_enabled", false).apply()
              }

              fun calculateNextWaterSlot(now: LocalDateTime): LocalDateTime {
                  val today = now.toLocalDate()
                  var slot = today.atTime(WATER_START)
                  val cutoff = today.atTime(WATER_END)
                  while (!slot.isAfter(cutoff)) {
                      if (slot.isAfter(now)) return slot
                      slot = slot.plusMinutes(WATER_INTERVAL_MINS)
                  }
                  return today.plusDays(1).atTime(WATER_START)
              }

              fun scheduleCustomAlarm(context: Context, hour: Int, minute: Int, label: String) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !am.canScheduleExactAlarms()) return

                  val now = LocalDateTime.now()
                  var target = LocalDate.now().atTime(hour, minute)
                  if (!target.isAfter(now)) target = target.plusDays(1)
                  val triggerMillis = target.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()

                  val intent = Intent(context, AlarmReceiver::class.java).apply {
                      putExtra("ALARM_TYPE", "CUSTOM")
                      putExtra("CUSTOM_LABEL", label)
                  }
                  val pi = PendingIntent.getBroadcast(
                      context, CUSTOM_REQ_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.setAlarmClock(AlarmManager.AlarmClockInfo(triggerMillis, pi), pi)

                  context.getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                      .edit()
                      .putBoolean("custom_enabled", true)
                      .putLong("custom_next", triggerMillis)
                      .putString("custom_label", label)
                      .apply()
              }

              fun cancelCustomAlarm(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val pi = PendingIntent.getBroadcast(
                      context, CUSTOM_REQ_CODE, Intent(context, AlarmReceiver::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.cancel(pi)
                  context.getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                      .edit().putBoolean("custom_enabled", false).apply()
              }

              fun rescheduleAll(context: Context) {
                  val prefs = context.getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("thyroid_enabled", true)) scheduleThyroidAlarm(context)
                  if (prefs.getBoolean("water_enabled", true)) scheduleNextWaterAlarm(context)
              }
          }
          EOF

