          // Custom Visual Dashboard Chart (Golden Snitch Weight Line + Emerald Walk Bars)
          class WellnessChartView(context: Context) : View(context) {
              private var logs = JSONArray()
              private val barPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#2E7D32") }
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#FFD700")
                  strokeWidth = 6f
                  style = Paint.Style.STROKE
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#FFD700") }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#F5E6C8")
                  textSize = 26f
                  textAlign = Paint.Align.CENTER
              }
              private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#4A2C31")
                  strokeWidth = 2f
              }

              fun setData(data: JSONArray) {
                  logs = data
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val pad = 48f
                  val chartBottom = h - 56f
                  val chartTop = 44f
                  val chartHeight = chartBottom - chartTop

                  canvas.drawLine(pad, chartBottom, w - pad, chartBottom, gridPaint)

                  if (logs.length() == 0) {
                      canvas.drawText("Log stats below to illuminate your Hogwarts chart ✨", w / 2f, h / 2f, textPaint)
                      return
                  }

                  // Legend at top
                  textPaint.textAlign = Paint.Align.LEFT
                  canvas.drawText("■ Walk (mins)   ● Weight (kg)", pad, 28f, textPaint)
                  textPaint.textAlign = Paint.Align.CENTER

                  val count = logs.length()
                  val slotW = (w - 2 * pad) / maxOf(count, 1)

                  var maxWalk = 60f
                  var minW = Float.MAX_VALUE
                  var maxW = Float.MIN_VALUE
                  for (i in 0 until count) {
                      val obj = logs.getJSONObject(i)
                      val walk = obj.optInt("walk", 0).toFloat()
                      if (walk > maxWalk) maxWalk = walk
                      val wt = obj.optDouble("weight", 0.0).toFloat()
                      if (wt > 0f) {
                          if (wt < minW) minW = wt
                          if (wt > maxW) maxW = wt
                      }
                  }
                  if (minW == Float.MAX_VALUE) { minW = 50f; maxW = 80f }
                  if (maxW - minW < 2f) { minW -= 1f; maxW += 1f }

                  val path = Path()
                  var hasStartedPath = false

                  for (i in 0 until count) {
                      val obj = logs.getJSONObject(i)
                      val cx = pad + slotW * i + slotW / 2f
                      val walk = obj.optInt("walk", 0).toFloat()
                      val wt = obj.optDouble("weight", 0.0).toFloat()
                      val date = obj.getString("date")

                      // Emerald Walk Bar
                      val barH = (walk / maxWalk) * (chartHeight * 0.85f)
                      canvas.drawRect(cx - 22f, chartBottom - barH, cx + 22f, chartBottom, barPaint)
                      if (walk > 0) {
                          canvas.drawText("${walk.toInt()}m", cx, chartBottom - barH - 8f, textPaint)
                      }

                      // Date label
                      canvas.drawText(date, cx, h - 16f, textPaint)

                      // Golden Weight Line
                      if (wt > 0f) {
                          val norm = (wt - minW) / (maxW - minW)
                          val wy = chartBottom - 24f - norm * (chartHeight * 0.75f)
                          if (!hasStartedPath) {
                              path.moveTo(cx, wy)
                              hasStartedPath = true
                          } else {
                              path.lineTo(cx, wy)
                          }
                          canvas.drawCircle(cx, wy, 9f, dotPaint)
                          canvas.drawText(String.format(Locale.US, "%.1f", wt), cx, wy - 16f, textPaint)
                      }
                  }
                  if (hasStartedPath) canvas.drawPath(path, linePaint)
              }
          }

