                      textSize = 20f
                      typeface = Typeface.SERIF
                      setTextColor(Color.parseColor("#F5E6C8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 56)
                  }
                  val dismissBtn = Button(this).apply {
                      text = "✨ FINITE INCANTATEM (STOP ALARM)"
                      textSize = 18f
                      typeface = Typeface.SERIF
                      setTypeface(typeface, Typeface.BOLD)
                      setBackgroundColor(Color.parseColor("#D4AF37"))
                      setTextColor(Color.parseColor("#120D0E"))
                      setPadding(36, 28, 36, 28)
                      setOnClickListener {
                          stopService(Intent(this@AlarmRingActivity, AlarmService::class.java))
                          finish()
                      }
                  }
                  layout.addView(crest)
                  layout.addView(titleView)
                  layout.addView(msgView)
                  layout.addView(dismissBtn)
                  setContentView(layout)
              }
          }
          EOF

      - name: Build Nasha Debug APK
        run: gradle assembleDebug

      - name: Upload Nasha APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nasha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
