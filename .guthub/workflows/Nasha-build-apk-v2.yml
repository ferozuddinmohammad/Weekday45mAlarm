          package com.example.nasha

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val type = intent.getStringExtra("ALARM_TYPE") ?: "WATER"
                  val customLabel = intent.getStringExtra("CUSTOM_LABEL") ?: "Magical Owl Reminder"

                  when (type) {
                      "THYROID" -> AlarmScheduler.scheduleThyroidAlarm(context)
                      "WATER" -> AlarmScheduler.scheduleNextWaterAlarm(context)
                      "CUSTOM" -> context.getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                          .edit().putBoolean("custom_enabled", false).apply()
                  }

                  val serviceIntent = Intent(context, AlarmService::class.java).apply {
                      putExtra("ALARM_TYPE", type)
                      putExtra("CUSTOM_LABEL", customLabel)
                  }
                  ContextCompat.startForegroundService(context, serviceIntent)
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      AlarmScheduler.rescheduleAll(context)
                  }
              }
          }
