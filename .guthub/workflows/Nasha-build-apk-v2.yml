          package com.example.nasha

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.*
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class AlarmService : Service(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var mediaPlayer: MediaPlayer? = null
              private var vibrator: Vibrator? = null
              private var isRunning = false
              private var alarmType = "WATER"
              private var spokenText = "Aguamenti! Time to drink one glass of water."
              private var displayTitle = "Aguamenti! Drink 1 Glass of Water"
              private val handler = Handler(Looper.getMainLooper())

              companion object {
                  const val CHANNEL_ID = "nasha_hogwarts_alarm_channel"
                  const val ACTION_STOP = "ACTION_STOP_NASHA_ALARM"
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  alarmType = intent?.getStringExtra("ALARM_TYPE") ?: "WATER"
                  val customLabel = intent?.getStringExtra("CUSTOM_LABEL") ?: "Magical Owl Post"

                  when (alarmType) {
                      "THYROID" -> {
                          displayTitle = "6:55 AM • Thyroid Potion"
                          spokenText = "My dear Nashu, take thyroid tablet."
                      }
                      "WATER" -> {
                          displayTitle = "Aguamenti • Drink 1 Glass of Water"
                          spokenText = "My dear Nashu, time to drink one glass of water."
                      }
                      else -> {
                          displayTitle = "Owl Post • $customLabel"
                          spokenText = "My dear Nashu, $customLabel."
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "Nasha Magical Alarms", NotificationManager.IMPORTANCE_HIGH
                      ).apply { setSound(null, null) }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }

                  val ringIntent = Intent(this, AlarmRingActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      putExtra("DISPLAY_TITLE", displayTitle)
                      putExtra("SPOKEN_TEXT", spokenText)
                  }
                  val fullScreenPI = PendingIntent.getActivity(
                      this, 0, ringIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val stopPI = PendingIntent.getService(
                      this, 1,
                      Intent(this, AlarmService::class.java).apply { action = ACTION_STOP },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_nasha_launcher)
                      .setContentTitle("⚡ $displayTitle")
                      .setContentText(spokenText)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setFullScreenIntent(fullScreenPI, true)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Finite Incantatem (Stop)", stopPI)
                      .setOngoing(true)
                      .build()

                  startForeground(3001, notification)
                  isRunning = true

                  // Start gentle background chime if NOT Thyroid voice loop (so voice is crystal clear!)
                  if (alarmType != "THYROID") {
                      val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                          ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                      mediaPlayer = MediaPlayer().apply {
                          setDataSource(applicationContext, alarmUri)
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          setVolume(0.45f, 0.45f)
                          isLooping = true
                          prepare()
                          start()
                      }
                  }

                  vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
                  vibrator?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 500, 700), 0))

                  tts = TextToSpeech(this, this)
                  return START_STICKY
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS && isRunning) {
                      tts?.language = Locale.US
                      tts?.setSpeechRate(0.92f)
                      val attrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build()
                      tts?.setAudioAttributes(attrs)

                      tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(utteranceId: String?) {}
                          override fun onError(utteranceId: String?) {
                              if (isRunning) handler.postDelayed({ speakNow() }, 1500)
                          }
                          override fun onDone(utteranceId: String?) {
                              // Repeat continuously until alarm is stopped!
                              if (isRunning) handler.postDelayed({ speakNow() }, 1200)
                          }
                      })
                      speakNow()
                  }
              }

              private fun speakNow() {
                  if (!isRunning) return
                  val params = Bundle().apply {
                      putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, android.media.AudioManager.STREAM_ALARM)
                  }
                  tts?.speak(spokenText, TextToSpeech.QUEUE_FLUSH, params, "NASHA_VOICE_UTTERANCE")
              }

              override fun onDestroy() {
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  tts?.stop()
                  tts?.shutdown()
                  mediaPlayer?.stop()
                  mediaPlayer?.release()
                  vibrator?.cancel()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
