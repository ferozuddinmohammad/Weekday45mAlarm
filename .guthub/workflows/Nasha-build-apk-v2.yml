                  return true
              }

              private fun refreshAlarmStatuses(thyroidBtn: Button?, waterBtn: Button?) {
                  val prefs = getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE)
                  val fmt = SimpleDateFormat("EEE, hh:mm a", Locale.getDefault())

                  val tOn = prefs.getBoolean("thyroid_enabled", true)
                  val tNext = prefs.getLong("thyroid_next", 0L)
                  thyroidStatusText.text = if (tOn && tNext > 0) "Active • Next: ${fmt.format(Date(tNext))}" else "Paused"
                  thyroidBtn?.text = if (tOn) "Pause 6:55 AM" else "Enable 6:55 AM"

                  val wOn = prefs.getBoolean("water_enabled", true)
                  val wNext = prefs.getLong("water_next", 0L)
                  val todayKey = "water_count_" + SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  val glasses = prefs.getInt(todayKey, 0)
                  waterStatusText.text = (if (wOn && wNext > 0) "Active • Next: ${fmt.format(Date(wNext))}" else "Stopped") +
                          "\nToday's Intake: $glasses glass(es)"
                  waterBtn?.text = if (wOn) "Stop 45m Water" else "Start 45m Water"

                  val cOn = prefs.getBoolean("custom_enabled", false)
                  val cNext = prefs.getLong("custom_next", 0L)
                  val cLabel = prefs.getString("custom_label", "")
                  customStatusText.text = if (cOn && cNext > 0) "Active: $cLabel at ${fmt.format(Date(cNext))}" else "No active owl reminder."
              }

              private fun showCustomAlarmPicker(tBtn: Button, wBtn: Button) {
                  val cal = Calendar.getInstance()
                  TimePickerDialog(this, { _, h, m ->
                      val input = EditText(this).apply { hint = "Reminder note (e.g., Evening Walk)" }
                      AlertDialog.Builder(this)
                          .setTitle(String.format(Locale.US, "Owl Post at %02d:%02d", h, m))
                          .setView(input)
                          .setPositiveButton("Set") { _, _ ->
                              val lbl = input.text.toString().trim().ifEmpty { "Personal Reminder" }
                              AlarmScheduler.scheduleCustomAlarm(this, h, m, lbl)
                              refreshAlarmStatuses(tBtn, wBtn)
                          }
                          .setNegativeButton("Cancel", null)
                          .show()
                  }, cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE), false).show()
              }

              private fun getTodoArray(): JSONArray {
                  val raw = getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE).getString("todos", null)
                  if (raw == null) {
                      // Pre-populate helpful starter items
                      val starter = JSONArray().apply {
                          put(JSONObject().apply { put("text", "Take 6:55 AM Thyroid tablet on empty stomach"); put("done", false) })
                          put(JSONObject().apply { put("text", "Complete 30 mins walking / physical movement"); put("done", false) })
                          put(JSONObject().apply { put("text", "Drink 8 glasses of water (10 AM - 8 PM)"); put("done", false) })
                      }
                      saveTodoArray(starter)
                      return starter
                  }
                  return JSONArray(raw)
              }

              private fun saveTodoArray(arr: JSONArray) {
                  getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE).edit().putString("todos", arr.toString()).apply()
              }

              private fun renderTodos() {
                  todoContainer.removeAllViews()
                  val arr = getTodoArray()
                  for (i in 0 until arr.length()) {
                      val obj = arr.getJSONObject(i)
                      val text = obj.getString("text")
                      val done = obj.optBoolean("done", false)

                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, 6, 0, 6)
                      }
                      val cb = CheckBox(this).apply {
                          this.text = text
                          isChecked = done
                          setTextColor(if (done) textMutedGold else textParchment)
                          paintFlags = if (done) paintFlags or Paint.STRIKE_THRU_TEXT_FLAG else paintFlags and Paint.STRIKE_THRU_TEXT_FLAG.inv()
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          setOnCheckedChangeListener { _, checked ->
                              val cur = getTodoArray()
                              if (i < cur.length()) {
                                  cur.getJSONObject(i).put("done", checked)
                                  saveTodoArray(cur)
                                  renderTodos()
                              }
                          }
                      }
                      val del = Button(this).apply {
                          this.text = "✕"
                          setTextColor(borderGold)
                          setBackgroundColor(Color.TRANSPARENT)
                          setOnClickListener {
                              val cur = getTodoArray()
                              val next = JSONArray()
                              for (j in 0 until cur.length()) if (j != i) next.put(cur.getJSONObject(j))
                              saveTodoArray(next)
                              renderTodos()
                          }
                      }
                      row.addView(cb)
                      row.addView(del)
                      todoContainer.addView(row)
                  }
              }

              private fun getWellnessLogs(): JSONArray {
                  val raw = getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE).getString("wellness_logs", "[]") ?: "[]"
                  return JSONArray(raw)
              }

              private fun logWellnessEntry(weight: Float?, walkMins: Int?) {
                  val arr = getWellnessLogs()
                  val today = SimpleDateFormat("MM/dd", Locale.US).format(Date())
                  var updated = false
                  for (i in 0 until arr.length()) {
                      val obj = arr.getJSONObject(i)
                      if (obj.getString("date") == today) {
                          if (weight != null) obj.put("weight", weight.toDouble())
                          if (walkMins != null) obj.put("walk", obj.optInt("walk", 0) + walkMins)
                          updated = true
                          break
                      }
                  }
                  if (!updated) {
                      val lastWeight = if (arr.length() > 0) arr.getJSONObject(arr.length() - 1).optDouble("weight", 0.0) else 0.0
                      arr.put(JSONObject().apply {
                          put("date", today)
                          put("weight", weight?.toDouble() ?: lastWeight)
                          put("walk", walkMins ?: 0)
                      })
                  }
                  // Keep last 7 entries for clean visual dashboard
                  val trimmed = JSONArray()
                  val startIdx = maxOf(0, arr.length() - 7)
                  for (i in startIdx until arr.length()) trimmed.put(arr.getJSONObject(i))
                  getSharedPreferences("nasha_prefs", Context.MODE_PRIVATE).edit().putString("wellness_logs", trimmed.toString()).apply()
              }

              private fun refreshDashboard() {
                  val arr = getWellnessLogs()
                  if (arr.length() == 0) {
                      dashboardSummaryText.text = "No entries yet. Log your weight (kg) and walking minutes below!"
                  } else {
                      val latest = arr.getJSONObject(arr.length() - 1)
                      val w = latest.optDouble("weight", 0.0)
                      val m = latest.optInt("walk", 0)
                      val wStr = if (w > 0) String.format(Locale.US, "%.1f kg", w) else "—"
                      dashboardSummaryText.text = "Latest (${latest.getString("date")}): Weight $wStr • Walked $m mins"
                  }
                  chartView.setData(arr)
              }

