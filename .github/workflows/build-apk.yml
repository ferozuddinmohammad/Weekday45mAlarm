              private fun ensureExactAlarmPermission(): Boolean {
                  val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !am.canScheduleExactAlarms()) {
                      startActivity(Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM))
                      return false
                  }
                  return true
              }

              private fun updateWeekdayStatus() {
                  val prefs = getSharedPreferences("alarm_prefs", Context.MODE_PRIVATE)
                  val enabled = prefs.getBoolean("is_enabled", false)
                  val nextMillis = prefs.getLong("next_trigger", 0L)
                  statusText.text = if (enabled && nextMillis > 0) {
                      val formatted = SimpleDateFormat("EEE, MMM d 'at' hh:mm a", Locale.getDefault()).format(Date(nextMillis))
                      "Status: ACTIVE\nNext Ring: $formatted"
                  } else {
                      "Status: INACTIVE"
                  }
              }

              private fun showAddCustomAlarmDialog() {
                  val cal = Calendar.getInstance()
                  TimePickerDialog(this, { _, hourOfDay, minute ->
                      val dialogLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(48, 24, 48, 8)
                      }
                      val labelInput = EditText(this).apply { hint = "Alarm Label (e.g., Standup, Medicine)" }
                      val repeatCheck = CheckBox(this).apply {
                          text = "Repeat Daily"
                          isChecked = true
                      }
                      dialogLayout.addView(labelInput)
                      dialogLayout.addView(repeatCheck)

                      AlertDialog.Builder(this)
                          .setTitle(String.format(Locale.getDefault(), "Set Alarm for %02d:%02d", hourOfDay, minute))
                          .setView(dialogLayout)
                          .setPositiveButton("Save") { _, _ ->
                              val list = AlarmScheduler.getCustomAlarms(this)
                              val newId = (System.currentTimeMillis() % 100000).toInt() + 2000
                              val label = labelInput.text.toString().trim().ifEmpty { "Custom Alarm" }
                              val newAlarm = CustomAlarm(newId, hourOfDay, minute, label, repeatCheck.isChecked, true)
                              list.add(newAlarm)
                              AlarmScheduler.saveCustomAlarms(this, list)
                              AlarmScheduler.scheduleCustomAlarm(this, newAlarm)
                              renderCustomAlarms()
                          }
                          .setNegativeButton("Cancel", null)
                          .show()
                  }, cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE), false).show()
              }

              private fun renderCustomAlarms() {
                  customAlarmsContainer.removeAllViews()
                  val list = AlarmScheduler.getCustomAlarms(this)
                  if (list.isEmpty()) {
                      customAlarmsContainer.addView(TextView(this).apply {
                          text = "No custom alarms set."
                          setTextColor(Color.GRAY)
                          setPadding(0, 8, 0, 0)
                      })
                      return
                  }
                  for (alarm in list) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, 12, 0, 12)
                      }
                      val amPm = if (alarm.hour >= 12) "PM" else "AM"
                      val hour12 = when {
                          alarm.hour == 0 -> 12
                          alarm.hour > 12 -> alarm.hour - 12
                          else -> alarm.hour
                      }
                      val timeStr = String.format(Locale.getDefault(), "%02d:%02d %s", hour12, alarm.minute, amPm)
                      val subStr = "${alarm.label} • ${if (alarm.repeatDaily) "Daily" else "Once"}"

                      val infoText = TextView(this).apply {
                          text = "$timeStr\n$subStr"
                          textSize = 15f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      val toggleSwitch = Switch(this).apply {
                          isChecked = alarm.enabled
                          setOnCheckedChangeListener { _, isChecked ->
                              val updated = AlarmScheduler.getCustomAlarms(this@MainActivity)
                              val idx = updated.indexOfFirst { it.id == alarm.id }
                              if (idx != -1) {
                                  updated[idx] = updated[idx].copy(enabled = isChecked)
                                  AlarmScheduler.saveCustomAlarms(this@MainActivity, updated)
                                  if (isChecked) AlarmScheduler.scheduleCustomAlarm(this@MainActivity, updated[idx])
                                  else AlarmScheduler.cancelCustomAlarm(this@MainActivity, alarm.id)
                              }
                          }
                      }
                      val delBtn = Button(this).apply {
                          text = "✕"
                          setOnClickListener {
                              AlarmScheduler.cancelCustomAlarm(this@MainActivity, alarm.id)
                              val updated = AlarmScheduler.getCustomAlarms(this@MainActivity).filter { it.id != alarm.id }
                              AlarmScheduler.saveCustomAlarms(this@MainActivity, updated)
                              renderCustomAlarms()
                          }
                      }
                      row.addView(infoText)
                      row.addView(toggleSwitch)
                      row.addView(delBtn)
                      customAlarmsContainer.addView(row)
                  }
              }

              private fun getChecklistArray(): JSONArray {
                  val raw = getSharedPreferences("notes_prefs", Context.MODE_PRIVATE)
                      .getString("checklist_items", "[]") ?: "[]"
                  return JSONArray(raw)
              }

              private fun saveChecklistArray(arr: JSONArray) {
                  getSharedPreferences("notes_prefs", Context.MODE_PRIVATE)
                      .edit()
                      .putString("checklist_items", arr.toString())
                      .apply()
              }

              private fun addChecklistItem(text: String) {
                  val arr = getChecklistArray()
                  arr.put(JSONObject().apply {
                      put("text", text)
                      put("done", false)
                  })
                  saveChecklistArray(arr)
                  renderChecklist()
              }

              private fun renderChecklist() {
                  checklistContainer.removeAllViews()
                  val arr = getChecklistArray()
                  if (arr.length() == 0) {
                      checklistContainer.addView(TextView(this).apply {
                          text = "Your checklist is empty."
                          setTextColor(Color.GRAY)
                          setPadding(0, 8, 0, 0)
                      })
                      return
                  }
                  for (i in 0 until arr.length()) {
                      val obj = arr.getJSONObject(i)
                      val itemText = obj.getString("text")
                      val isDone = obj.optBoolean("done", false)

                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, 6, 0, 6)
                      }
                      val checkBox = CheckBox(this).apply {
                          text = itemText
                          isChecked = isDone
                          textSize = 15f
                          paintFlags = if (isDone) paintFlags or Paint.STRIKE_THRU_TEXT_FLAG else paintFlags and Paint.STRIKE_THRU_TEXT_FLAG.inv()
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          setOnCheckedChangeListener { _, checked ->
                              val current = getChecklistArray()
                              if (i < current.length()) {
                                  current.getJSONObject(i).put("done", checked)
                                  saveChecklistArray(current)
                                  renderChecklist()
                              }
                          }
                      }
                      val removeBtn = Button(this).apply {
                          text = "✕"
                          setOnClickListener {
                              val current = getChecklistArray()
                              val next = JSONArray()
                              for (j in 0 until current.length()) {
                                  if (j != i) next.put(current.getJSONObject(j))
                              }
                              saveChecklistArray(next)
                              renderChecklist()
                          }
                      }
                      row.addView(checkBox)
                      row.addView(removeBtn)
                      checklistContainer.addView(row)
                  }
              }

              private fun createCard(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 28, 32, 28)
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 24f
                          setStroke(2, Color.parseColor("#FFCDD2"))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = 28 }
                  }
              }

              private fun sectionTitle(title: String): TextView {
                  return TextView(this).apply {
                      text = title
                      textSize = 17f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#B71C1C"))
                      setPadding(0, 0, 0, 12)
                  }
              }
          }

          class AlarmRingActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val label = intent.getStringExtra("ALARM_LABEL") ?: "Scheduled Alarm"

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#B71C1C"))
                      setPadding(48, 48, 48, 48)
                  }
                  val titleView = TextView(this).apply {
                      text = "❤️\n$label"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 48)
                  }
                  val dismissButton = Button(this).apply {
                      text = "DISMISS ALARM"
                      textSize = 22f
                      setBackgroundColor(Color.WHITE)
                      setTextColor(Color.parseColor("#B71C1C"))
                      setOnClickListener {
                          stopService(Intent(this@AlarmRingActivity, AlarmService::class.java))
                          finish()
                      }
                  }
                  layout.addView(titleView)
                  layout.addView(dismissButton)
                  setContentView(layout)
              }
          }
