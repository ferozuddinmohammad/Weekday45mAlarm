          cat << 'EOF' > app/src/main/java/com/example/weekdayintervalalarm/AlarmScheduler.kt
          package com.example.weekdayintervalalarm

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.DayOfWeek
          import java.time.LocalDate
          import java.time.LocalDateTime
          import java.time.LocalTime
          import java.time.ZoneId

          data class CustomAlarm(
              val id: Int,
              val hour: Int,
              val minute: Int,
              val label: String,
              val repeatDaily: Boolean,
              val enabled: Boolean
          )

          object AlarmScheduler {
              private const val WEEKDAY_REQUEST_CODE = 1001
              private val START_TIME = LocalTime.of(9, 0)
              private val END_TIME = LocalTime.of(18, 0)
              private const val INTERVAL_MINUTES = 45L

              fun scheduleNextWeekdayAlarm(context: Context) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !alarmManager.canScheduleExactAlarms()) return

                  val nextTriggerTime = calculateNextWeekdaySlot(LocalDateTime.now())
                  val triggerMillis = nextTriggerTime.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()

                  val intent = Intent(context, AlarmReceiver::class.java).apply {
                      putExtra("ALARM_TYPE", "WEEKDAY_45M")
                      putExtra("ALARM_LABEL", "45-Minute Weekday Check-in")
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, WEEKDAY_REQUEST_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  alarmManager.setAlarmClock(AlarmManager.AlarmClockInfo(triggerMillis, pendingIntent), pendingIntent)

                  context.getSharedPreferences("alarm_prefs", Context.MODE_PRIVATE)
                      .edit()
                      .putBoolean("is_enabled", true)
                      .putLong("next_trigger", triggerMillis)
                      .apply()
              }

              fun cancelWeekdayAlarm(context: Context) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(context, AlarmReceiver::class.java)
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, WEEKDAY_REQUEST_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  alarmManager.cancel(pendingIntent)
                  context.getSharedPreferences("alarm_prefs", Context.MODE_PRIVATE)
                      .edit()
                      .putBoolean("is_enabled", false)
                      .apply()
              }

              fun calculateNextWeekdaySlot(now: LocalDateTime): LocalDateTime {
                  val candidateDate = now.toLocalDate()
                  if (candidateDate.dayOfWeek == DayOfWeek.SATURDAY) return candidateDate.plusDays(2).atTime(START_TIME)
                  if (candidateDate.dayOfWeek == DayOfWeek.SUNDAY) return candidateDate.plusDays(1).atTime(START_TIME)
                  var slot = candidateDate.atTime(START_TIME)
                  val cutoff = candidateDate.atTime(END_TIME)
                  while (!slot.isAfter(cutoff)) {
                      if (slot.isAfter(now)) return slot
                      slot = slot.plusMinutes(INTERVAL_MINUTES)
                  }
                  var nextDay = candidateDate.plusDays(1)
                  while (nextDay.dayOfWeek == DayOfWeek.SATURDAY || nextDay.dayOfWeek == DayOfWeek.SUNDAY) {
                      nextDay = nextDay.plusDays(1)
                  }
                  return nextDay.atTime(START_TIME)
              }

              fun getCustomAlarms(context: Context): MutableList<CustomAlarm> {
                  val jsonStr = context.getSharedPreferences("alarm_prefs", Context.MODE_PRIVATE)
                      .getString("custom_alarms", "[]") ?: "[]"
                  val arr = JSONArray(jsonStr)
                  val list = mutableListOf<CustomAlarm>()
                  for (i in 0 until arr.length()) {
                      val obj = arr.getJSONObject(i)
                      list.add(
                          CustomAlarm(
                              id = obj.getInt("id"),
                              hour = obj.getInt("hour"),
                              minute = obj.getInt("minute"),
                              label = obj.optString("label", "Custom Alarm"),
                              repeatDaily = obj.optBoolean("repeatDaily", false),
                              enabled = obj.optBoolean("enabled", true)
                          )
                      )
                  }
                  return list
              }

              fun saveCustomAlarms(context: Context, list: List<CustomAlarm>) {
                  val arr = JSONArray()
                  for (item in list) {
                      val obj = JSONObject().apply {
                          put("id", item.id)
                          put("hour", item.hour)
                          put("minute", item.minute)
                          put("label", item.label)
                          put("repeatDaily", item.repeatDaily)
                          put("enabled", item.enabled)
                      }
                      arr.put(obj)
                  }
                  context.getSharedPreferences("alarm_prefs", Context.MODE_PRIVATE)
                      .edit()
                      .putString("custom_alarms", arr.toString())
                      .apply()
              }

              fun scheduleCustomAlarm(context: Context, alarm: CustomAlarm) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !alarmManager.canScheduleExactAlarms()) return

                  val now = LocalDateTime.now()
                  var target = LocalDate.now().atTime(alarm.hour, alarm.minute)
                  if (!target.isAfter(now)) {
                      target = target.plusDays(1)
                  }
                  val triggerMillis = target.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()

                  val intent = Intent(context, AlarmReceiver::class.java).apply {
                      putExtra("ALARM_TYPE", "CUSTOM")
                      putExtra("CUSTOM_ID", alarm.id)
                      putExtra("ALARM_LABEL", alarm.label)
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, alarm.id, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  alarmManager.setAlarmClock(AlarmManager.AlarmClockInfo(triggerMillis, pendingIntent), pendingIntent)
              }

              fun cancelCustomAlarm(context: Context, alarmId: Int) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(context, AlarmReceiver::class.java)
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, alarmId, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  alarmManager.cancel(pendingIntent)
              }

              fun rescheduleAll(context: Context) {
                  val prefs = context.getSharedPreferences("alarm_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("is_enabled", false)) {
                      scheduleNextWeekdayAlarm(context)
                  }
                  for (alarm in getCustomAlarms(context)) {
                      if (alarm.enabled) scheduleCustomAlarm(context, alarm)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/weekdayintervalalarm/AlarmReceiver.kt
          package com.example.weekdayintervalalarm

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val type = intent.getStringExtra("ALARM_TYPE") ?: "WEEKDAY_45M"
                  val label = intent.getStringExtra("ALARM_LABEL") ?: "Scheduled Alarm"

                  if (type == "WEEKDAY_45M") {
                      AlarmScheduler.scheduleNextWeekdayAlarm(context)
                  } else if (type == "CUSTOM") {
                      val customId = intent.getIntExtra("CUSTOM_ID", -1)
                      val list = AlarmScheduler.getCustomAlarms(context)
                      val idx = list.indexOfFirst { it.id == customId }
                      if (idx != -1) {
                          val alarm = list[idx]
                          if (alarm.repeatDaily) {
                              AlarmScheduler.scheduleCustomAlarm(context, alarm)
                          } else {
                              list[idx] = alarm.copy(enabled = false)
                              AlarmScheduler.saveCustomAlarms(context, list)
                          }
                      }
                  }

                  val serviceIntent = Intent(context, AlarmService::class.java).apply {
                      putExtra("ALARM_LABEL", label)
                  }
                  ContextCompat.startForegroundService(context, serviceIntent)
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      AlarmScheduler.rescheduleAll(context)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/weekdayintervalalarm/AlarmService.kt
          package com.example.weekdayintervalalarm

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.*
          import androidx.core.app.NotificationCompat

          class AlarmService : Service() {
              private var mediaPlayer: MediaPlayer? = null
              private var vibrator: Vibrator? = null

              companion object {
                  const val CHANNEL_ID = "weekday_45m_alarm_channel"
                  const val ACTION_STOP = "ACTION_STOP_ALARM"
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val label = intent?.getStringExtra("ALARM_LABEL") ?: "Scheduled Alarm"

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "Heart Alarms", NotificationManager.IMPORTANCE_HIGH
                      ).apply { setSound(null, null) }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }

                  val ringIntent = Intent(this, AlarmRingActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      putExtra("ALARM_LABEL", label)
                  }
                  val fullScreenPendingIntent = PendingIntent.getActivity(
                      this, 0, ringIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val stopPendingIntent = PendingIntent.getService(
                      this, 1,
                      Intent(this, AlarmService::class.java).apply { action = ACTION_STOP },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_heart_launcher)
                      .setContentTitle("❤️ $label")
                      .setContentText("Tap Dismiss to stop the alarm.")
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setFullScreenIntent(fullScreenPendingIntent, true)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Dismiss", stopPendingIntent)
                      .setOngoing(true)
                      .build()

                  startForeground(2001, notification)

                  val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                  mediaPlayer = MediaPlayer().apply {
                      setDataSource(applicationContext, alarmUri)
                      setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                      )
                      isLooping = true
                      prepare()
                      start()
                  }

                  vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
                  vibrator?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 500, 500), 0))
                  return START_STICKY
              }

              override fun onDestroy() {
                  mediaPlayer?.stop()
                  mediaPlayer?.release()
                  vibrator?.cancel()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/weekdayintervalalarm/MainActivity.kt
          package com.example.weekdayintervalalarm

          import android.Manifest
          import android.app.AlarmManager
          import android.app.AlertDialog
          import android.app.TimePickerDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : AppCompatActivity() {

              private lateinit var statusText: TextView
              private lateinit var customAlarmsContainer: LinearLayout
              private lateinit var checklistContainer: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                  }

                  val scrollView = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#FFF8F9"))
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 56, 40, 80)
                  }
                  scrollView.addView(root)

                  // Header
                  val header = TextView(this).apply {
                      text = "❤️ Heart Alarm & Notes"
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#C62828"))
                      setPadding(0, 0, 0, 28)
                  }
                  root.addView(header)

                  // --- SECTION 1: WEEKDAY 45-MIN ALARM ---
                  val weekdayCard = createCard()
                  weekdayCard.addView(sectionTitle("⏱️ Weekday 45-Min Interval (9 AM – 6 PM)"))
                  statusText = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.parseColor("#333333"))
                      setPadding(0, 8, 0, 20)
                  }
                  weekdayCard.addView(statusText)

                  val btnRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val startBtn = Button(this).apply {
                      text = "Start 45m"
                      setBackgroundColor(Color.parseColor("#D32F2F"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginEnd = 12
                      }
                  }
                  val stopBtn = Button(this).apply {
                      text = "Stop 45m"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginStart = 12
                      }
                  }
                  btnRow.addView(startBtn)
                  btnRow.addView(stopBtn)
                  weekdayCard.addView(btnRow)
                  root.addView(weekdayCard)

                  startBtn.setOnClickListener {
                      if (ensureExactAlarmPermission()) {
                          AlarmScheduler.scheduleNextWeekdayAlarm(this)
                          updateWeekdayStatus()
                      }
                  }
                  stopBtn.setOnClickListener {
                      AlarmScheduler.cancelWeekdayAlarm(this)
                      stopService(Intent(this, AlarmService::class.java))
                      updateWeekdayStatus()
                  }

                  // --- SECTION 2: CUSTOM ALARMS ---
                  val customCard = createCard()
                  customCard.addView(sectionTitle("⏰ Custom Alarms"))
                  val addAlarmBtn = Button(this).apply {
                      text = "+ Add Custom Alarm"
                      setBackgroundColor(Color.parseColor("#E53935"))
                      setTextColor(Color.WHITE)
                  }
                  customCard.addView(addAlarmBtn)

                  customAlarmsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 16, 0, 0)
                  }
                  customCard.addView(customAlarmsContainer)
                  root.addView(customCard)

                  addAlarmBtn.setOnClickListener {
                      if (ensureExactAlarmPermission()) {
                          showAddCustomAlarmDialog()
                      }
                  }

                  // --- SECTION 3: TO-DO CHECKLIST ---
                  val checklistCard = createCard()
                  checklistCard.addView(sectionTitle("✅ To-Do Checklist"))

                  val addTaskRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val taskInput = EditText(this).apply {
                      hint = "Add a to-do item..."
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val addTaskBtn = Button(this).apply {
                      text = "Add"
                      setBackgroundColor(Color.parseColor("#D32F2F"))
                      setTextColor(Color.WHITE)
                  }
                  addTaskRow.addView(taskInput)
                  addTaskRow.addView(addTaskBtn)
                  checklistCard.addView(addTaskRow)

                  checklistContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 12, 0, 0)
                  }
                  checklistCard.addView(checklistContainer)
                  root.addView(checklistCard)

                  addTaskBtn.setOnClickListener {
                      val text = taskInput.text.toString().trim()
                      if (text.isNotEmpty()) {
                          addChecklistItem(text)
                          taskInput.setText("")
                      }
                  }

                  // --- SECTION 4: NOTEPAD ---
                  val notepadCard = createCard()
                  notepadCard.addView(sectionTitle("📝 Quick Notepad"))
                  val prefs = getSharedPreferences("notes_prefs", Context.MODE_PRIVATE)
                  val notepadEdit = EditText(this).apply {
                      hint = "Write your notes here (auto-saved)..."
                      minLines = 5
                      gravity = Gravity.TOP or Gravity.START
                      setText(prefs.getString("quick_note", ""))
                      setBackgroundColor(Color.parseColor("#FFFDFD"))
                      setPadding(24, 24, 24, 24)
                  }
                  notepadEdit.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          prefs.edit().putString("quick_note", s?.toString() ?: "").apply()
                      }
