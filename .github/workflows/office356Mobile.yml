              // 6. MICROSOFT TO DO (SAVED PERMANENTLY TO MOBILE)
              // =========================================================================
              private fun renderToDoApp() {
                  workspaceContainer.removeAllViews()
                  headerTitleText.text = "Microsoft To Do"
                  headerBadgeText.text = "SAVED ON PHONE"
                  (headerBadgeText.background as GradientDrawable).setColor(todoBlue)

                  val scroll = ScrollView(this)
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 28, 32, 48)
                  }
                  scroll.addView(col)

                  val addCard = m365Card()
                  addCard.addView(TextView(this).apply {
                      text = "☑️ Add Task to Mobile Storage"
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(todoBlue)
                      setPadding(0, 0, 0, 10)
                  })

                  val taskTitleInput = EditText(this).apply {
                      hint = "Task title..."
                      setTextColor(textDark)
                  }
                  val taskNoteInput = EditText(this).apply {
                      hint = "Notes / due date..."
                      textSize = 14f
                      setTextColor(textMuted)
                  }
                  val addTaskBtn = Button(this).apply {
                      text = "+ Save Task to Phone"
                      setBackgroundColor(todoBlue)
                      setTextColor(Color.WHITE)
                  }
                  addCard.addView(taskTitleInput)
                  addCard.addView(taskNoteInput)
                  addCard.addView(addTaskBtn)
                  col.addView(addCard)

                  val listContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(listContainer)

                  fun refreshTasksUI() {
                      listContainer.removeAllViews()
                      val arr = getTodoList()
                      if (arr.length() == 0) {
                          listContainer.addView(TextView(this).apply {
                              text = "No tasks yet. Tasks added here stay saved on your mobile."
                              textSize = 14f
                              setTextColor(textMuted)
                              setPadding(8, 16, 8, 16)
                          })
                          return
                      }
                      for (i in 0 until arr.length()) {
                          val obj = arr.getJSONObject(i)
                          val title = obj.getString("title")
                          val note = obj.optString("note", "")
                          val done = obj.optBoolean("done", false)
                          val starred = obj.optBoolean("starred", false)

                          val itemCard = m365Card().apply {
                              setPadding(24, 16, 24, 16)
                              (layoutParams as LinearLayout.LayoutParams).bottomMargin = 14
                          }
                          val row = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                          }
                          val cb = CheckBox(this).apply {
                              isChecked = done
                              setOnCheckedChangeListener { _, checked ->
                                  val cur = getTodoList()
                                  if (i < cur.length()) {
                                      cur.getJSONObject(i).put("done", checked)
                                      saveTodoList(cur)
                                      refreshTasksUI()
                                  }
                              }
                          }
                          val textCol = LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          }
                          textCol.addView(TextView(this).apply {
                              text = title
                              textSize = 15f
                              setTypeface(null, if (starred) Typeface.BOLD else Typeface.NORMAL)
                              setTextColor(if (done) textMuted else textDark)
                              paintFlags = if (done) paintFlags or Paint.STRIKE_THRU_TEXT_FLAG else paintFlags and Paint.STRIKE_THRU_TEXT_FLAG.inv()
                          })
                          if (note.isNotEmpty()) {
                              textCol.addView(TextView(this).apply {
                                  text = note
                                  textSize = 12f
                                  setTextColor(textMuted)
                              })
                          }
                          val starBtn = Button(this).apply {
                              text = if (starred) "⭐" else "☆"
                              setBackgroundColor(Color.TRANSPARENT)
                              setOnClickListener {
                                  val cur = getTodoList()
                                  if (i < cur.length()) {
                                      cur.getJSONObject(i).put("starred", !starred)
                                      saveTodoList(cur)
                                      refreshTasksUI()
                                  }
                              }
                          }
                          val delBtn = Button(this).apply {
                              text = "🗑️"
                              setBackgroundColor(Color.TRANSPARENT)
                              setOnClickListener {
                                  val cur = getTodoList()
                                  val next = JSONArray()
                                  for (j in 0 until cur.length()) if (j != i) next.put(cur.getJSONObject(j))
                                  saveTodoList(next)
                                  refreshTasksUI()
                              }
                          }
                          row.addView(cb); row.addView(textCol); row.addView(starBtn); row.addView(delBtn)
                          itemCard.addView(row)
                          listContainer.addView(itemCard)
                      }
                  }

                  addTaskBtn.setOnClickListener {
                      val t = taskTitleInput.text.toString().trim()
                      if (t.isNotEmpty()) {
                          val arr = getTodoList()
                          arr.put(JSONObject().apply {
                              put("title", t)
                              put("note", taskNoteInput.text.toString().trim())
                              put("done", false)
                              put("starred", false)
                          })
                          saveTodoList(arr)
                          taskTitleInput.setText("")
                          taskNoteInput.setText("")
                          refreshTasksUI()
                          Toast.makeText(this, "☑️ Task saved!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  refreshTasksUI()
                  workspaceContainer.addView(scroll)
              }

