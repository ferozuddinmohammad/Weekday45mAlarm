              // =========================================================================
              // 5. PDF VIEWER, HIGHLIGHTER, COMMENTER & DIGITAL SIGNATURE PAD
              // =========================================================================
              private fun renderPdfViewerAndEditor(file: LoadedOfficeFile) {
                  workspaceContainer.removeAllViews()
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 18, 24, 18)
                  }

                  val navRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 12)
                  }
                  val prevBtn = Button(this).apply {
                      text = "◀"
                      isEnabled = activePdfPage > 0
                      setOnClickListener { activePdfPage--; renderPdfViewerAndEditor(file) }
                  }
                  val pageIndicator = TextView(this).apply {
                      text = "Page ${activePdfPage + 1} / ${file.pdfPageCount}"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setTextColor(textDark)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val signBtn = Button(this).apply {
                      text = "✒️ Sign PDF"
                      setBackgroundColor(pdfCrimson)
                      setTextColor(Color.WHITE)
                      setOnClickListener { showSignaturePadDialog(file) }
                  }
                  val nextBtn = Button(this).apply {
                      text = "▶"
                      isEnabled = activePdfPage < file.pdfPageCount - 1
                      setOnClickListener { activePdfPage++; renderPdfViewerAndEditor(file) }
                  }
                  navRow.addView(prevBtn)
                  navRow.addView(pageIndicator)
                  navRow.addView(signBtn)
                  navRow.addView(nextBtn)
                  container.addView(navRow)

                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  }
                  val inner = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  scroll.addView(inner)

                  val path = file.pdfCachedPath
                  if (path != null) {
                      val bmp = OfficeEngine.renderPdfPageBitmap(path, activePdfPage)
                      if (bmp != null) {
                          val imgView = ImageView(this).apply {
                              setImageBitmap(bmp)
                              adjustViewBounds = true
                              setBackgroundColor(Color.WHITE)
                              setPadding(8, 8, 8, 8)
                              layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply { bottomMargin = 16 }
                          }
                          inner.addView(imgView)
                      }
                  }

                  while (file.pdfAnnotations.size <= activePdfPage) file.pdfAnnotations.add("")
                  while (file.pdfHighlights.size <= activePdfPage) file.pdfHighlights.add("")

                  val noteCard = m365Card()
                  if (file.pdfSignatures.containsKey(activePdfPage)) {
                      noteCard.addView(TextView(this).apply {
                          text = "✅ Digital signature attached to Page ${activePdfPage + 1}"
                          textSize = 13f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(excelGreen)
                          setPadding(0, 0, 0, 8)
                      })
                  }

                  noteCard.addView(TextView(this).apply {
                      text = "🖍️ Highlight Banner / Key Callout"
                      textSize = 13f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#B45309"))
                  })
                  val hlInput = EditText(this).apply {
                      setText(file.pdfHighlights[activePdfPage])
                      hint = "Highlighted text banner for Page ${activePdfPage + 1}..."
                      setTextColor(textDark)
                  }
                  hlInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) { file.pdfHighlights[activePdfPage] = s?.toString() ?: "" }
                  })
                  noteCard.addView(hlInput)

                  noteCard.addView(TextView(this).apply {
                      text = if (path != null) "💬 Page Comment / Annotation" else "📄 PDF Page Content"
                      textSize = 13f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(pdfCrimson)
                      setPadding(0, 12, 0, 4)
                  })
                  val noteInput = EditText(this).apply {
                      setText(file.pdfAnnotations[activePdfPage])
                      hint = "Type text or comment for Page ${activePdfPage + 1}..."
                      minLines = if (path != null) 3 else 12
                      gravity = Gravity.TOP or Gravity.START
                      setTextColor(textDark)
                  }
                  noteInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) { file.pdfAnnotations[activePdfPage] = s?.toString() ?: "" }
                  })
                  noteCard.addView(noteInput)
                  inner.addView(noteCard)

                  container.addView(scroll)
                  workspaceContainer.addView(container)
              }

              private fun showSignaturePadDialog(file: LoadedOfficeFile) {
                  val pad = SignatureDrawView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 420)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("✒️ Draw Your Signature")
                      .setView(pad)
                      .setPositiveButton("Attach to Page ${activePdfPage + 1}") { _, _ ->
                          file.pdfSignatures[activePdfPage] = pad.exportBitmap()
                          renderPdfViewerAndEditor(file)
                          Toast.makeText(this, "Signature attached! Tap Save to export PDF.", Toast.LENGTH_SHORT).show()
                      }
                      .setNeutralButton("Clear") { _, _ -> showSignaturePadDialog(file) }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

