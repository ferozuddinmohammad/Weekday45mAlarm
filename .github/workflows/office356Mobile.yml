              // =========================================================================
              // 2. RICH WORD EDITOR (Bold, Italic, Underline, Align, Find, Read Aloud)
              // =========================================================================
              private fun renderWordEditor(file: LoadedOfficeFile) {
                  workspaceContainer.removeAllViews()
                  val outer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  // Word Ribbon Toolbar
                  val ribbonScroll = HorizontalScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#E1DFDD"))
                      setPadding(16, 10, 16, 10)
                  }
                  val ribbon = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  ribbonScroll.addView(ribbon)

                  val editor = EditText(this).apply {
                      setText(Html.fromHtml(file.wordHtml, Html.FROM_HTML_MODE_COMPACT))
                      hint = "Type your Word document here..."
                      textSize = 16f
                      setTextColor(textDark)
                      setBackgroundColor(Color.TRANSPARENT)
                      gravity = Gravity.TOP or when (file.wordAlign) {
                          "CENTER" -> Gravity.CENTER_HORIZONTAL
                          "RIGHT" -> Gravity.END
                          else -> Gravity.START
                      }
                      minLines = 18
                      setLineSpacing(8f, 1.15f)
                  }

                  fun toggleSpan(style: Int) {
                      val start = editor.selectionStart
                      val end = editor.selectionEnd
                      if (start >= 0 && end > start) {
                          val str = editor.text as Spannable
                          str.setSpan(StyleSpan(style), start, end, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                          file.wordHtml = Html.toHtml(editor.text, Html.TO_HTML_PARAGRAPH_LINES_CONSECUTIVE)
                      } else {
                          Toast.makeText(this, "Highlight text first to format", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val boldBtn = ribbonBtn("B", Typeface.BOLD) { toggleSpan(Typeface.BOLD) }
                  val italicBtn = ribbonBtn("I", Typeface.ITALIC) { toggleSpan(Typeface.ITALIC) }
                  val underlineBtn = ribbonBtn("U", Typeface.NORMAL) {
                      val start = editor.selectionStart
                      val end = editor.selectionEnd
                      if (start >= 0 && end > start) {
                          (editor.text as Spannable).setSpan(UnderlineSpan(), start, end, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                          file.wordHtml = Html.toHtml(editor.text, Html.TO_HTML_PARAGRAPH_LINES_CONSECUTIVE)
                      } else {
                          Toast.makeText(this, "Highlight text first to underline", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val bulletBtn = ribbonBtn("• List", Typeface.NORMAL) {
                      val pos = maxOf(editor.selectionStart, 0)
                      editor.text.insert(pos, "\n• ")
                  }
                  val alignBtn = ribbonBtn("⇄ Align", Typeface.NORMAL) {
                      file.wordAlign = when (file.wordAlign) {
                          "LEFT" -> "CENTER"
                          "CENTER" -> "RIGHT"
                          else -> "LEFT"
                      }
                      editor.gravity = Gravity.TOP or when (file.wordAlign) {
                          "CENTER" -> Gravity.CENTER_HORIZONTAL
                          "RIGHT" -> Gravity.END
                          else -> Gravity.START
                      }
                      Toast.makeText(this, "Alignment: ${file.wordAlign}", Toast.LENGTH_SHORT).show()
                  }
                  val findBtn = ribbonBtn("🔍 Find", Typeface.NORMAL) {
                      val input = EditText(this).apply { hint = "Find word in document..." }
                      AlertDialog.Builder(this)
                          .setTitle("Find Text")
                          .setView(input)
                          .setPositiveButton("Find") { _, _ ->
                              val term = input.text.toString()
                              val idx = editor.text.toString().indexOf(term, ignoreCase = true)
                              if (idx >= 0 && term.isNotEmpty()) {
                                  editor.requestFocus()
                                  editor.setSelection(idx, idx + term.length)
                              } else {
                                  Toast.makeText(this, "Not found", Toast.LENGTH_SHORT).show()
                              }
                          }
                          .setNegativeButton("Cancel", null)
                          .show()
                  }
                  val readAloudBtn = ribbonBtn("🔊 Read", Typeface.NORMAL) {
                      val plain = editor.text.toString().trim()
                      if (plain.isNotEmpty()) {
                          tts?.speak(plain.take(3500), TextToSpeech.QUEUE_FLUSH, null, "M365_READ")
                          Toast.makeText(this, "Reading document aloud...", Toast.LENGTH_SHORT).show()
                      }
                  }

                  listOf(boldBtn, italicBtn, underlineBtn, bulletBtn, alignBtn, findBtn, readAloudBtn).forEach {
                      ribbon.addView(it)
                  }
                  outer.addView(ribbonScroll)

                  val scroll = ScrollView(this).apply {
                      setPadding(24, 20, 24, 24)
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  }
                  val pageCard = m365Card().apply { setPadding(34, 34, 34, 34) }
                  scroll.addView(pageCard)

                  val statsText = TextView(this).apply {
                      textSize = 12f
                      setTextColor(textMuted)
                      setPadding(0, 0, 0, 12)
                  }
                  pageCard.addView(statsText)

                  fun updateStats(s: String) {
                      val words = s.trim().split("\\s+".toRegex()).count { it.isNotEmpty() }
                      statsText.text = "Words: $words  •  Chars: ${s.length}  •  Align: ${file.wordAlign}"
                  }
                  updateStats(editor.text.toString())

                  editor.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          file.wordHtml = Html.toHtml(editor.text, Html.TO_HTML_PARAGRAPH_LINES_CONSECUTIVE)
                          updateStats(s?.toString() ?: "")
                      }
                  })
                  pageCard.addView(editor)
                  outer.addView(scroll)
                  workspaceContainer.addView(outer)
              }

              // =========================================================================
              // 3. EXCEL SPREADSHEET EDITOR (Live Formula Bar + AutoSum + Multi-Sheet)
              // =========================================================================
              private fun renderExcelEditor(file: LoadedOfficeFile) {
                  workspaceContainer.removeAllViews()
                  val container = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val grid = file.sheets[activeSheetName] ?: mutableListOf()
                  var selectedRow = 0
                  var selectedCol = 0

                  // Excel Formula Bar (fx)
                  val fxBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.WHITE)
                      setPadding(20, 10, 20, 10)
                  }
                  val cellRefBadge = TextView(this).apply {
                      text = "A1"
                      textSize = 13f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(excelGreen)
                      setPadding(0, 0, 16, 0)
                  }
                  val fxLabel = TextView(this).apply {
                      text = "fx  "
                      textSize = 14f
                      setTypeface(null, Typeface.ITALIC)
                      setTextColor(textMuted)
                  }
                  val fxEdit = EditText(this).apply {
                      hint = "Enter value or formula (=SUM(A1:A5))..."
                      textSize = 14f
                      setSingleLine(true)
                      setTextColor(textDark)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val applyFxBtn = Button(this).apply {
                      text = "✓"
                      setBackgroundColor(excelGreen)
                      setTextColor(Color.WHITE)
                  }
                  fxBar.addView(cellRefBadge)
                  fxBar.addView(fxLabel)
                  fxBar.addView(fxEdit)
                  fxBar.addView(applyFxBtn)
                  container.addView(fxBar)

                  // Ribbon Controls
                  val controlScroll = HorizontalScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#E1DFDD"))
                      setPadding(16, 10, 16, 10)
                  }
                  val controlRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  controlScroll.addView(controlRow)

                  for (sName in file.sheets.keys) {
                      val isSelected = sName == activeSheetName
                      val tab = Button(this).apply {
                          text = sName
                          textSize = 12f
                          setTextColor(if (isSelected) Color.WHITE else textDark)
                          setBackgroundColor(if (isSelected) excelGreen else Color.WHITE)
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { marginEnd = 10 }
                          setOnClickListener {
                              activeSheetName = sName
                              renderExcelEditor(file)
                          }
                      }
                      controlRow.addView(tab)
                  }

                  controlRow.addView(ribbonBtn("∑ AutoSum", Typeface.BOLD) {
                      if (selectedRow > 0 && selectedRow in grid.indices && selectedCol in grid[selectedRow].indices) {
                          val colName = colLetter(selectedCol)
                          grid[selectedRow][selectedCol] = "=SUM(${colName}1:${colName}${selectedRow})"
                          renderExcelEditor(file)
                      }
                  })
                  controlRow.addView(ribbonBtn("+ Sheet", Typeface.NORMAL) {
                      val nextName = "Sheet${file.sheets.size + 1}"
                      file.sheets[nextName] = MutableList(16) { MutableList(7) { "" } }
                      activeSheetName = nextName
                      renderExcelEditor(file)
                  })
                  controlRow.addView(ribbonBtn("+ Row", Typeface.NORMAL) {
                      val cols = grid.firstOrNull()?.size ?: 7
                      grid.add(MutableList(cols) { "" })
                      renderExcelEditor(file)
                  })
                  controlRow.addView(ribbonBtn("+ Col", Typeface.NORMAL) {
                      for (row in grid) row.add("")
                      renderExcelEditor(file)
                  })
                  container.addView(controlScroll)

                  applyFxBtn.setOnClickListener {
                      if (selectedRow in grid.indices && selectedCol in grid[selectedRow].indices) {
                          grid[selectedRow][selectedCol] = fxEdit.text.toString()
                          renderExcelEditor(file)
                      }
                  }

                  val vScroll = ScrollView(this)
                  val hScroll = HorizontalScrollView(this)
                  val table = TableLayout(this).apply { setPadding(16, 16, 16, 48) }
                  hScroll.addView(table)
                  vScroll.addView(hScroll)

                  val colCount = grid.firstOrNull()?.size ?: 7
                  val headerRow = TableRow(this)
                  headerRow.addView(cellHeaderView("#", 90))
                  for (c in 0 until colCount) headerRow.addView(cellHeaderView(colLetter(c), 240))
                  table.addView(headerRow)

                  for (r in grid.indices) {
                      val tr = TableRow(this)
                      tr.addView(cellHeaderView("${r + 1}", 90))
                      val rowCells = grid[r]
                      for (c in 0 until colCount) {
                          val raw = rowCells[c]
                          val displayVal = OfficeEngine.evaluateCellDisplay(raw, grid)
                          val cellEdit = EditText(this).apply {
                              setText(displayVal)
                              textSize = 14f
                              setTextColor(if (raw.startsWith("=")) excelGreen else textDark)
                              setTypeface(null, if (raw.startsWith("=")) Typeface.BOLD else Typeface.NORMAL)
                              setSingleLine(true)
                              setPadding(16, 14, 16, 14)
                              width = 240
                              background = GradientDrawable().apply {
                                  setColor(Color.WHITE)
                                  setStroke(1, borderSubtle)
                              }
                          }
                          cellEdit.setOnFocusChangeListener { _, hasFocus ->
                              if (hasFocus) {
                                  selectedRow = r
                                  selectedCol = c
                                  cellRefBadge.text = "${colLetter(c)}${r + 1}"
                                  fxEdit.setText(rowCells[c])
                              } else {
                                  val entered = cellEdit.text.toString()
                                  if (entered != OfficeEngine.evaluateCellDisplay(rowCells[c], grid)) {
                                      rowCells[c] = entered
                                  }
                              }
                          }
                          cellEdit.addTextChangedListener(object : TextWatcher {
                              override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                              override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                              override fun afterTextChanged(s: Editable?) {
                                  if (cellEdit.hasFocus()) {
                                      rowCells[c] = s?.toString() ?: ""
                                  }
                              }
                          })
                          tr.addView(cellEdit)
                      }
                      table.addView(tr)
                  }

                  container.addView(vScroll)
                  workspaceContainer.addView(container)
              }

              // =========================================================================
              // 4. POWERPOINT EDITOR + FULL-SCREEN SLIDESHOW MODE + SPEAKER NOTES
              // =========================================================================
              private fun renderPowerPointEditor(file: LoadedOfficeFile) {
                  workspaceContainer.removeAllViews()
                  if (file.slides.isEmpty()) file.slides.add(SlideItem("Slide 1", ""))
                  if (activeSlideIndex >= file.slides.size) activeSlideIndex = file.slides.size - 1
                  val currentSlide = file.slides[activeSlideIndex]

                  // Full-Screen Slideshow Presentation Mode
                  if (isPresentationMode) {
                      val presLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          setBackgroundColor(Color.parseColor("#111827"))
                          setPadding(48, 48, 48, 48)
                      }
                      presLayout.addView(TextView(this).apply {
                          text = currentSlide.title
                          textSize = 28f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          setPadding(0, 0, 0, 32)
                      })
