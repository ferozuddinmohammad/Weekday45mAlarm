        run: gradle assembleDebug

      - name: Upload Microsoft 365 Pocket APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microsoft365Pocket-APK
          path: app/build/outputs/apk/debug/app-debug.apk
