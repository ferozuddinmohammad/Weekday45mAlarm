name: Build Office365Pocket APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Full Microsoft 365 Pocket Android Project
        run: |
          mkdir -p app/src/main/java/com/example/officepocket
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Office365Pocket"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.officepocket"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.officepocket"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
                  multiDexEnabled = true
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              packaging {
                  resources {
                      excludes += setOf(
                          "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE",
                          "META-INF/LICENSE.txt",
                          "META-INF/license.txt",
                          "META-INF/NOTICE",
                          "META-INF/NOTICE.txt",
                          "META-INF/notice.txt",
                          "META-INF/*.SF",
                          "META-INF/*.DSA",
                          "META-INF/*.RSA"
                      )
                  }
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.apache.poi:poi:5.2.5")
              implementation("org.apache.poi:poi-ooxml:5.2.5")
              implementation("org.apache.poi:poi-scratchpad:5.2.5")
              implementation("org.apache.xmlbeans:xmlbeans:5.2.0")
              implementation("javax.xml.stream:stax-api:1.0-2")
              implementation("com.fasterxml:aalto-xml:1.3.2")
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_office365_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#D83B01"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M62,20L28,33v42l14,-4V39l20,-6v44l-34,-9l34,19l18,-6V26z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:largeHeap="true"
                  android:icon="@drawable/ic_office365_launcher"
                  android:roundIcon="@drawable/ic_office365_launcher"
                  android:label="Microsoft 365 Pocket"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/msword" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                          <data android:mimeType="application/vnd.ms-excel" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                          <data android:mimeType="application/vnd.ms-powerpoint" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.presentationml.presentation" />
                          <data android:mimeType="application/pdf" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/officepocket/OfficeEngine.kt
          package com.example.officepocket

          import android.content.Context
          import android.graphics.*
          import android.graphics.pdf.PdfDocument
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.ParcelFileDescriptor
          import android.provider.OpenableColumns
          import android.text.Html
          import android.text.SpannableStringBuilder
          import android.text.Spanned
          import android.text.style.StyleSpan
          import android.text.style.UnderlineSpan
          import org.apache.poi.hslf.usermodel.HSLFSlideShow
          import org.apache.poi.hslf.usermodel.HSLFTextShape
          import org.apache.poi.hssf.usermodel.HSSFWorkbook
          import org.apache.poi.hwpf.HWPFDocument
          import org.apache.poi.hwpf.extractor.WordExtractor
          import org.apache.poi.ss.usermodel.CellType
          import org.apache.poi.ss.usermodel.DataFormatter
          import org.apache.poi.ss.usermodel.Workbook
          import org.apache.poi.ss.usermodel.WorkbookFactory
          import org.apache.poi.xslf.usermodel.XMLSlideShow
          import org.apache.poi.xslf.usermodel.XSLFTextShape
          import org.apache.poi.xssf.usermodel.XSSFWorkbook
          import org.apache.poi.xwpf.usermodel.ParagraphAlignment
          import org.apache.poi.xwpf.usermodel.UnderlinePatterns
          import org.apache.poi.xwpf.usermodel.XWPFDocument
          import java.io.ByteArrayInputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.io.OutputStream

          enum class DocType { WORD_DOC, WORD_DOCX, EXCEL_XLS, EXCEL_XLSX, PPT_PPT, PPT_PPTX, PDF_DOC }

          data class SlideItem(
              var title: String,
              var body: String,
              var speakerNotes: String = ""
          )

          data class LoadedOfficeFile(
              val fileName: String,
              val type: DocType,
              val sourceUri: Uri?,
              var wordHtml: String = "",
              var wordAlign: String = "LEFT",
              var wordFontSize: Int = 12,
              var sheets: MutableMap<String, MutableList<MutableList<String>>> = linkedMapOf(),
              var slides: MutableList<SlideItem> = mutableListOf(),
              var pdfCachedPath: String? = null,
              var pdfPageCount: Int = 0,
              var pdfAnnotations: MutableList<String> = mutableListOf(),
              var pdfHighlights: MutableList<String> = mutableListOf(),
              var pdfSignatures: MutableMap<Int, Bitmap> = mutableMapOf()
          )

          object OfficeEngine {

              init {
                  System.setProperty("org.apache.poi.javax.xml.stream.XMLInputFactory", "com.fasterxml.aalto.stax.InputFactoryImpl")
                  System.setProperty("org.apache.poi.javax.xml.stream.XMLOutputFactory", "com.fasterxml.aalto.stax.OutputFactoryImpl")
                  System.setProperty("org.apache.poi.javax.xml.stream.XMLEventFactory", "com.fasterxml.aalto.stax.EventFactoryImpl")
              }

              fun getFileName(context: Context, uri: Uri): String {
                  var name = "Document"
                  context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx != -1 && cursor.moveToFirst()) {
                          name = cursor.getString(idx) ?: name
                      }
                  }
                  return name
              }

              fun detectType(fileName: String, mimeType: String?): DocType {
                  val lower = fileName.lowercase()
                  return when {
                      lower.endsWith(".pdf") -> DocType.PDF_DOC
                      lower.endsWith(".docx") -> DocType.WORD_DOCX
                      lower.endsWith(".doc") -> DocType.WORD_DOC
                      lower.endsWith(".xlsx") -> DocType.EXCEL_XLSX
                      lower.endsWith(".xls") -> DocType.EXCEL_XLS
                      lower.endsWith(".pptx") -> DocType.PPT_PPTX
                      lower.endsWith(".ppt") -> DocType.PPT_PPT
                      mimeType?.contains("pdf") == true -> DocType.PDF_DOC
                      mimeType?.contains("wordprocessingml") == true -> DocType.WORD_DOCX
                      mimeType?.contains("msword") == true -> DocType.WORD_DOC
                      mimeType?.contains("spreadsheetml") == true -> DocType.EXCEL_XLSX
                      mimeType?.contains("ms-excel") == true -> DocType.EXCEL_XLS
                      mimeType?.contains("presentationml") == true -> DocType.PPT_PPTX
                      mimeType?.contains("ms-powerpoint") == true -> DocType.PPT_PPT
                      else -> DocType.WORD_DOCX
                  }
              }

              fun loadDocument(context: Context, uri: Uri): LoadedOfficeFile {
                  val name = getFileName(context, uri)
                  val mime = context.contentResolver.getType(uri)
                  val type = detectType(name, mime)
                  val bytes = context.contentResolver.openInputStream(uri)?.use { it.readBytes() }
                      ?: throw IllegalStateException("Cannot read file stream")

                  return when (type) {
                      DocType.PDF_DOC -> {
                          val cacheFile = File(context.cacheDir, "active_view_${System.currentTimeMillis()}.pdf")
                          FileOutputStream(cacheFile).use { it.write(bytes) }
                          var pageCount = 1
                          ParcelFileDescriptor.open(cacheFile, ParcelFileDescriptor.MODE_READ_ONLY).use { pfd ->
                              PdfRenderer(pfd).use { renderer ->
                                  pageCount = maxOf(renderer.pageCount, 1)
                              }
                          }
                          LoadedOfficeFile(
                              fileName = name,
                              type = type,
                              sourceUri = uri,
                              pdfCachedPath = cacheFile.absolutePath,
                              pdfPageCount = pageCount,
                              pdfAnnotations = MutableList(pageCount) { "" },
                              pdfHighlights = MutableList(pageCount) { "" }
                          )
                      }
                      DocType.WORD_DOCX -> {
                          XWPFDocument(ByteArrayInputStream(bytes)).use { doc ->
                              val sb = StringBuilder()
                              for (p in doc.paragraphs) {
                                  for (run in p.runs) {
                                      var t = Html.escapeHtml(run.text() ?: "")
                                      if (run.isBold) t = "<b>$t</b>"
                                      if (run.isItalic) t = "<i>$t</i>"
                                      if (run.underline != UnderlinePatterns.NONE) t = "<u>$t</u>"
                                      sb.append(t)
                                  }
                                  sb.append("<br>")
                              }
                              LoadedOfficeFile(name, type, uri, wordHtml = sb.toString())
                          }
                      }
                      DocType.WORD_DOC -> {
                          HWPFDocument(ByteArrayInputStream(bytes)).use { doc ->
                              val extractor = WordExtractor(doc)
                              val html = extractor.paragraphText
                                  .joinToString("<br>") { Html.escapeHtml(it.replace("\r", "").trimEnd('\n')) }
                              LoadedOfficeFile(name, type, uri, wordHtml = html)
                          }
                      }
                      DocType.EXCEL_XLSX, DocType.EXCEL_XLS -> {
                          WorkbookFactory.create(ByteArrayInputStream(bytes)).use { wb ->
                              val formatter = DataFormatter()
                              val sheetMap = linkedMapOf<String, MutableList<MutableList<String>>>()
                              for (sIdx in 0 until wb.numberOfSheets) {
                                  val sheet = wb.getSheetAt(sIdx)
                                  val rowsList = mutableListOf<MutableList<String>>()
                                  val maxRows = maxOf(sheet.lastRowNum + 1, 16)
                                  var maxCols = 7
                                  for (r in 0..sheet.lastRowNum) {
                                      val row = sheet.getRow(r)
                                      if (row != null && row.lastCellNum > maxCols) {
                                          maxCols = row.lastCellNum.toInt()
                                      }
                                  }
                                  for (r in 0 until maxRows) {
                                      val row = sheet.getRow(r)
                                      val cells = mutableListOf<String>()
                                      for (c in 0 until maxCols) {
                                          val cell = row?.getCell(c)
                                          val strVal = when {
                                              cell == null -> ""
                                              cell.cellType == CellType.FORMULA -> {
                                                  try { "=" + cell.cellFormula } catch (_: Exception) { formatter.formatCellValue(cell) }
                                              }
                                              else -> formatter.formatCellValue(cell)
                                          }
                                          cells.add(strVal)
                                      }
                                      rowsList.add(cells)
                                  }
                                  sheetMap[sheet.sheetName] = rowsList
                              }
                              if (sheetMap.isEmpty()) sheetMap["Sheet1"] = MutableList(16) { MutableList(7) { "" } }
                              LoadedOfficeFile(name, type, uri, sheets = sheetMap)
                          }
                      }
                      DocType.PPT_PPTX -> {
                          XMLSlideShow(ByteArrayInputStream(bytes)).use { ppt ->
                              val slideList = mutableListOf<SlideItem>()
                              for ((idx, slide) in ppt.slides.withIndex()) {
                                  val texts = mutableListOf<String>()
                                  for (shape in slide.shapes) {
                                      if (shape is XSLFTextShape) {
                                          val t = shape.text?.trim() ?: ""
                                          if (t.isNotEmpty()) texts.add(t)
                                      }
                                  }
                                  val title = texts.firstOrNull() ?: "Slide ${idx + 1}"
                                  val body = if (texts.size > 1) texts.drop(1).joinToString("\n") else ""
                                  slideList.add(SlideItem(title, body))
                              }
                              if (slideList.isEmpty()) slideList.add(SlideItem("Slide 1", ""))
                              LoadedOfficeFile(name, type, uri, slides = slideList)
                          }
                      }
                      DocType.PPT_PPT -> {
                          HSLFSlideShow(ByteArrayInputStream(bytes)).use { ppt ->
                              val slideList = mutableListOf<SlideItem>()
                              for ((idx, slide) in ppt.slides.withIndex()) {
                                  val texts = mutableListOf<String>()
                                  for (shape in slide.shapes) {
                                      if (shape is HSLFTextShape) {
                                          val t = shape.text?.trim() ?: ""
                                          if (t.isNotEmpty()) texts.add(t)
                                      }
                                  }
                                  val title = texts.firstOrNull() ?: "Slide ${idx + 1}"
                                  val body = if (texts.size > 1) texts.drop(1).joinToString("\n") else ""
                                  slideList.add(SlideItem(title, body))
                              }
                              if (slideList.isEmpty()) slideList.add(SlideItem("Slide 1", ""))
                              LoadedOfficeFile(name, type, uri, slides = slideList)
                          }
                      }
                  }
              }

              // Built-in Live Formula Evaluator for Excel Grid (=SUM, =AVERAGE, =MIN, =MAX, =COUNT, =A1+B1, etc.)
              fun evaluateCellDisplay(raw: String, grid: List<List<String>>): String {
                  val trimmed = raw.trim()
                  if (!trimmed.startsWith("=")) return raw
                  val expr = trimmed.substring(1).trim().uppercase()
                  return try {
                      when {
                          expr.startsWith("SUM(") && expr.endsWith(")") -> {
                              val vals = extractRangeValues(expr.removePrefix("SUM(").removeSuffix(")"), grid)
                              formatNum(vals.sum())
                          }
                          expr.startsWith("AVERAGE(") && expr.endsWith(")") -> {
                              val vals = extractRangeValues(expr.removePrefix("AVERAGE(").removeSuffix(")"), grid)
                              if (vals.isEmpty()) "0" else formatNum(vals.average())
                          }
                          expr.startsWith("MIN(") && expr.endsWith(")") -> {
                              val vals = extractRangeValues(expr.removePrefix("MIN(").removeSuffix(")"), grid)
                              formatNum(vals.minOrNull() ?: 0.0)
                          }
                          expr.startsWith("MAX(") && expr.endsWith(")") -> {
                              val vals = extractRangeValues(expr.removePrefix("MAX(").removeSuffix(")"), grid)
                              formatNum(vals.maxOrNull() ?: 0.0)
                          }
                          expr.startsWith("COUNT(") && expr.endsWith(")") -> {
                              val vals = extractRangeValues(expr.removePrefix("COUNT(").removeSuffix(")"), grid)
                              vals.size.toString()
                          }
                          else -> {
                              // Replace cell refs like A1, B2 with numeric values and evaluate simple arithmetic
                              val replaced = Regex("[A-Z]+[0-9]+").replace(expr) { m ->
                                  val (r, c) = parseCellRef(m.value)
                                  val v = if (r in grid.indices && c in grid[r].indices) {
                                      evaluateCellDisplay(grid[r][c], grid).toDoubleOrNull() ?: 0.0
                                  } else 0.0
                                  v.toString()
                              }
                              formatNum(evalSimpleMath(replaced))
                          }
                      }
                  } catch (_: Exception) {
                      raw
                  }
              }

              private fun formatNum(d: Double): String {
                  return if (d % 1.0 == 0.0) d.toLong().toString() else String.format(java.util.Locale.US, "%.2f", d)
              }

              private fun parseCellRef(ref: String): Pair<Int, Int> {
                  val letters = ref.takeWhile { it.isLetter() }
                  val digits = ref.dropWhile { it.isLetter() }
                  var col = 0
                  for (ch in letters) col = col * 26 + (ch - 'A' + 1)
                  val row = (digits.toIntOrNull() ?: 1) - 1
                  return Pair(row, col - 1)
              }

              private fun extractRangeValues(arg: String, grid: List<List<String>>): List<Double> {
                  val out = mutableListOf<Double>()
                  for (part in arg.split(",")) {
                      val p = part.trim()
                      if (p.contains(":")) {
                          val (startRef, endRef) = p.split(":")
                          val (r1, c1) = parseCellRef(startRef.trim())
                          val (r2, c2) = parseCellRef(endRef.trim())
                          for (r in minOf(r1, r2)..maxOf(r1, r2)) {
                              for (c in minOf(c1, c2)..maxOf(c1, c2)) {
                                  if (r in grid.indices && c in grid[r].indices) {
                                      evaluateCellDisplay(grid[r][c], grid).toDoubleOrNull()?.let { out.add(it) }
                                  }
                              }
                          }
                      } else {
                          val (r, c) = parseCellRef(p)
                          if (r in grid.indices && c in grid[r].indices) {
                              evaluateCellDisplay(grid[r][c], grid).toDoubleOrNull()?.let { out.add(it) }
                          }
                      }
                  }
                  return out
              }

              private fun evalSimpleMath(expr: String): Double {
                  val clean = expr.replace(" ", "")
                  // Handle + and - at top level
                  for (i in clean.length - 1 downTo 1) {
                      val ch = clean[i]
                      if (ch == '+' || ch == '-') {
                          val left = evalSimpleMath(clean.substring(0, i))
                          val right = evalSimpleMath(clean.substring(i + 1))
                          return if (ch == '+') left + right else left - right
                      }
                  }
                  for (i in clean.length - 1 downTo 1) {
                      val ch = clean[i]
                      if (ch == '*' || ch == '/') {
                          val left = evalSimpleMath(clean.substring(0, i))
                          val right = evalSimpleMath(clean.substring(i + 1))
                          return if (ch == '*') left * right else if (right != 0.0) left / right else 0.0
                      }
                  }
                  return clean.toDoubleOrNull() ?: 0.0
              }

              fun renderPdfPageBitmap(pdfPath: String, pageIndex: Int): Bitmap? {
                  val file = File(pdfPath)
                  if (!file.exists()) return null
                  return ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY).use { pfd ->
                      PdfRenderer(pfd).use { renderer ->
                          if (pageIndex < 0 || pageIndex >= renderer.pageCount) return@use null
                          renderer.openPage(pageIndex).use { page ->
                              val scale = 2
                              val bmp = Bitmap.createBitmap(page.width * scale, page.height * scale, Bitmap.Config.ARGB_8888)
                              val canvas = Canvas(bmp)
                              canvas.drawColor(Color.WHITE)
                              page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                              bmp
                          }
                      }
                  }
              }

              fun createPdfFromImage(context: Context, imageUri: Uri): LoadedOfficeFile {
                  val bmp = context.contentResolver.openInputStream(imageUri)?.use { BitmapFactory.decodeStream(it) }
                      ?: throw IllegalStateException("Cannot decode scanned image")
                  val pdfDoc = PdfDocument()
                  val pageInfo = PdfDocument.PageInfo.Builder(bmp.width, bmp.height, 1).create()
                  val page = pdfDoc.startPage(pageInfo)
                  page.canvas.drawBitmap(bmp, 0f, 0f, null)
                  pdfDoc.finishPage(page)

                  val outFile = File(context.cacheDir, "scan_${System.currentTimeMillis()}.pdf")
                  FileOutputStream(outFile).use { pdfDoc.writeTo(it) }
                  pdfDoc.close()

                  return LoadedOfficeFile(
                      fileName = "OfficeLens_Scan_${System.currentTimeMillis() % 10000}.pdf",
                      type = DocType.PDF_DOC,
                      sourceUri = null,
                      pdfCachedPath = outFile.absolutePath,
                      pdfPageCount = 1,
                      pdfAnnotations = mutableListOf(""),
                      pdfHighlights = mutableListOf("")
                  )
              }

              fun saveDocument(file: LoadedOfficeFile, out: OutputStream) {
                  when (file.type) {
                      DocType.PDF_DOC -> {
                          val pdfDoc = PdfDocument()
                          val notePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color = Color.parseColor("#B91C1C")
                              textSize = 24f
                              typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                          }
                          val bannerPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color = Color.parseColor("#FEF2F2")
                          }
                          val highlightPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color = Color.argb(95, 254, 240, 138)
                          }

                          val srcPath = file.pdfCachedPath
                          if (srcPath != null && File(srcPath).exists()) {
                              ParcelFileDescriptor.open(File(srcPath), ParcelFileDescriptor.MODE_READ_ONLY).use { pfd ->
                                  PdfRenderer(pfd).use { renderer ->
                                      for (i in 0 until renderer.pageCount) {
                                          val page = renderer.openPage(i)
                                          val w = page.width * 2
                                          val h = page.height * 2
                                          val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                                          val bmpCanvas = Canvas(bmp)
                                          bmpCanvas.drawColor(Color.WHITE)
                                          page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                                          page.close()

                                          val pageInfo = PdfDocument.PageInfo.Builder(w, h, i + 1).create()
                                          val outPage = pdfDoc.startPage(pageInfo)
                                          outPage.canvas.drawBitmap(bmp, 0f, 0f, null)

                                          // Draw signature ink overlay if signed on this page
                                          file.pdfSignatures[i]?.let { sigBmp ->
                                              val scaledSig = Bitmap.createScaledBitmap(sigBmp, w / 3, h / 6, true)
                                              outPage.canvas.drawBitmap(scaledSig, w - (w / 3f) - 40f, h - (h / 6f) - 120f, null)
                                          }

                                          val hl = file.pdfHighlights.getOrNull(i)?.trim() ?: ""
                                          if (hl.isNotEmpty()) {
                                              outPage.canvas.drawRect(30f, h - 180f, w - 30f, h - 120f, highlightPaint)
                                              outPage.canvas.drawText("Highlight: $hl", 50f, h - 142f, notePaint)
                                          }

                                          val note = file.pdfAnnotations.getOrNull(i)?.trim() ?: ""
                                          if (note.isNotEmpty()) {
                                              outPage.canvas.drawRect(30f, h - 110f, w - 30f, h - 30f, bannerPaint)
                                              outPage.canvas.drawText("Comment: $note", 50f, h - 60f, notePaint)
                                          }
                                          pdfDoc.finishPage(outPage)
                                      }
                                  }
                              }
                          } else {
                              for (i in 0 until maxOf(file.pdfPageCount, 1)) {
                                  val pageInfo = PdfDocument.PageInfo.Builder(1080, 1528, i + 1).create()
                                  val outPage = pdfDoc.startPage(pageInfo)
                                  outPage.canvas.drawColor(Color.WHITE)
                                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                                      color = Color.BLACK
                                      textSize = 32f
                                  }
                                  val note = file.pdfAnnotations.getOrNull(i) ?: ""
                                  var yPos = 100f
                                  for (line in note.split("\n")) {
                                      outPage.canvas.drawText(line, 72f, yPos, textPaint)
                                      yPos += 48f
                                  }
                                  file.pdfSignatures[i]?.let { sigBmp ->
                                      val scaledSig = Bitmap.createScaledBitmap(sigBmp, 320, 160, true)
                                      outPage.canvas.drawBitmap(scaledSig, 680f, 1280f, null)
                                  }
                                  pdfDoc.finishPage(outPage)
                              }
                          }
                          pdfDoc.writeTo(out)
                          pdfDoc.close()
                      }
                      DocType.WORD_DOCX, DocType.WORD_DOC -> {
                          XWPFDocument().use { doc ->
                              val spanned: Spanned = Html.fromHtml(file.wordHtml, Html.FROM_HTML_MODE_COMPACT)
                              val lines = spanned.toString().split("\n")
                              var cursor = 0
                              for (line in lines) {
                                  val p = doc.createParagraph()
                                  p.alignment = when (file.wordAlign) {
                                      "CENTER" -> ParagraphAlignment.CENTER
                                      "RIGHT" -> ParagraphAlignment.RIGHT
                                      else -> ParagraphAlignment.LEFT
                                  }
                                  val run = p.createRun()
                                  run.setText(line)
                                  run.fontSize = file.wordFontSize
                                  if (line.isNotEmpty() && cursor < spanned.length) {
                                      val endIdx = minOf(cursor + line.length, spanned.length)
                                      val styles = spanned.getSpans(cursor, endIdx, StyleSpan::class.java)
                                      for (st in styles) {
                                          if (st.style == Typeface.BOLD || st.style == Typeface.BOLD_ITALIC) run.isBold = true
                                          if (st.style == Typeface.ITALIC || st.style == Typeface.BOLD_ITALIC) run.isItalic = true
                                      }
                                      val underlines = spanned.getSpans(cursor, endIdx, UnderlineSpan::class.java)
                                      if (underlines.isNotEmpty()) run.underline = UnderlinePatterns.SINGLE
                                  }
                                  cursor += line.length + 1
                              }
                              doc.write(out)
                          }
                      }
                      DocType.EXCEL_XLSX, DocType.EXCEL_XLS -> {
                          val wb: Workbook = if (file.type == DocType.EXCEL_XLS) HSSFWorkbook() else XSSFWorkbook()
                          wb.use {
                              for ((sheetName, grid) in file.sheets) {
                                  val sheet = it.createSheet(sheetName)
                                  for ((rIdx, rowValues) in grid.withIndex()) {
                                      val row = sheet.createRow(rIdx)
                                      for ((cIdx, rawVal) in rowValues.withIndex()) {
                                          val trimmed = rawVal.trim()
                                          if (trimmed.isNotEmpty()) {
                                              val cell = row.createCell(cIdx)
                                              val num = trimmed.toDoubleOrNull()
                                              when {
                                                  trimmed.startsWith("=") && trimmed.length > 1 -> {
                                                      try { cell.cellFormula = trimmed.substring(1) } catch (_: Exception) { cell.setCellValue(rawVal) }
                                                  }
                                                  num != null -> cell.setCellValue(num)
                                                  else -> cell.setCellValue(rawVal)
                                              }
                                          }
                                      }
                                  }
                              }
                              it.write(out)
                          }
                      }
                      DocType.PPT_PPTX, DocType.PPT_PPT -> {
                          XMLSlideShow().use { ppt ->
                              for (item in file.slides) {
                                  val slide = ppt.createSlide()
                                  val titleBox = slide.createTextBox()
                                  val titleXfrm = titleBox.xmlObject as org.openxmlformats.schemas.presentationml.x2006.main.CTShape
                                  titleXfrm.spPr.addNewXfrm().apply {
                                      addNewOff().apply { x = 508000L; y = 381000L }
                                      addNewExt().apply { cx = 8128000L; cy = 1016000L }
                                  }
                                  val tr = titleBox.addNewTextParagraph().addNewTextRun()
                                  tr.setText(item.title)
                                  tr.fontSize = 28.0
                                  tr.isBold = true

                                  val bodyBox = slide.createTextBox()
                                  val bodyXfrm = bodyBox.xmlObject as org.openxmlformats.schemas.presentationml.x2006.main.CTShape
                                  bodyXfrm.spPr.addNewXfrm().apply {
                                      addNewOff().apply { x = 508000L; y = 1651000L }
                                      addNewExt().apply { cx = 8128000L; cy = 4572000L }
                                  }
                                  for (line in item.body.split("\n")) {
                                      val br = bodyBox.addNewTextParagraph().addNewTextRun()
                                      br.setText(line)
                                      br.fontSize = 18.0
                                  }
                              }
                              ppt.write(out)
                          }
                      }
                  }
              }

              fun exportCurrentFileAsPdf(file: LoadedOfficeFile, out: OutputStream) {
                  if (file.type == DocType.PDF_DOC) {
                      saveDocument(file, out)
                      return
                  }
                  val pdfDoc = PdfDocument()
                  val titlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#111827")
                      textSize = 36f
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  }
                  val bodyPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#1F2937")
                      textSize = 26f
                  }

                  val pageInfo = PdfDocument.PageInfo.Builder(1080, 1528, 1).create()
                  val page = pdfDoc.startPage(pageInfo)
                  val canvas = page.canvas
                  canvas.drawColor(Color.WHITE)
                  canvas.drawText(file.fileName, 64f, 84f, titlePaint)

                  var y = 150f
                  when (file.type) {
                      DocType.WORD_DOC, DocType.WORD_DOCX -> {
                          val plain = Html.fromHtml(file.wordHtml, Html.FROM_HTML_MODE_COMPACT).toString()
                          for (p in plain.split("\n")) {
                              if (y > 1440f) break
                              canvas.drawText(p.take(75), 64f, y, bodyPaint)
                              y += 42f
                          }
                      }
                      DocType.EXCEL_XLS, DocType.EXCEL_XLSX -> {
                          for ((sName, grid) in file.sheets) {
                              if (y > 1440f) break
                              canvas.drawText("Sheet: $sName", 64f, y, titlePaint)
                              y += 46f
                              for (row in grid) {
                                  if (y > 1440f) break
                                  val line = row.map { evaluateCellDisplay(it, grid) }.filter { it.isNotBlank() }.joinToString(" | ")
                                  if (line.isNotEmpty()) {
                                      canvas.drawText(line.take(75), 64f, y, bodyPaint)
                                      y += 38f
                                  }
                              }
                          }
                      }
                      DocType.PPT_PPT, DocType.PPT_PPTX -> {
                          for ((idx, slide) in file.slides.withIndex()) {
                              if (y > 1440f) break
                              canvas.drawText("Slide ${idx + 1}: ${slide.title}", 64f, y, titlePaint)
                              y += 44f
                              for (bLine in slide.body.split("\n")) {
                                  if (y > 1440f) break
                                  canvas.drawText(bLine.take(75), 84f, y, bodyPaint)
                                  y += 38f
                              }
                              y += 20f
                          }
                      }
                      else -> {}
                  }
                  pdfDoc.finishPage(page)
                  pdfDoc.writeTo(out)
                  pdfDoc.close()
              }
          }
