                  })

                  val speakerNotesInput = EditText(this).apply {
                      setText(currentSlide.speakerNotes)
                      hint = "🎙️ Speaker notes (private presenter notes)..."
                      textSize = 13f
                      setTextColor(textMuted)
                      setSingleLine(true)
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = 10 }
                  }
                  speakerNotesInput.addTextChangedListener(object : TextWatcher {
