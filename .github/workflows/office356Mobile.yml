                  fun refreshNotes() {
                      notesList.removeAllViews()
                      val arr = getStickyNotes()
                      for (i in 0 until arr.length()) {
                          val obj = arr.getJSONObject(i)
                          val card = m365Card().apply {
                              background = GradientDrawable().apply {
                                  setColor(Color.parseColor("#FEF9C3"))
                                  cornerRadius = 18f
                                  setStroke(2, Color.parseColor("#FDE047"))
                              }
                          }
                          card.addView(TextView(this).apply {
                              text = obj.getString("body")
                              textSize = 15f
                              setTextColor(textDark)
                          })
                          val footer = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                              setPadding(0, 10, 0, 0)
                          }
                          footer.addView(TextView(this).apply {
                              text = obj.optString("date", "")
                              textSize = 11f
                              setTextColor(textMuted)
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          })
                          footer.addView(Button(this).apply {
                              text = "Delete"
                              textSize = 11f
                              setBackgroundColor(Color.TRANSPARENT)
                              setTextColor(pdfCrimson)
                              setOnClickListener {
                                  val cur = getStickyNotes()
                                  val next = JSONArray()
                                  for (j in 0 until cur.length()) if (j != i) next.put(cur.getJSONObject(j))
                                  saveStickyNotes(next)
                                  refreshNotes()
                              }
                          })
                          card.addView(footer)
                          notesList.addView(card)
                      }
                  }

                  saveNoteBtn.setOnClickListener {
                      val txt = noteInput.text.toString().trim()
                      if (txt.isNotEmpty()) {
                          val arr = getStickyNotes()
                          arr.put(JSONObject().apply {
                              put("body", txt)
                              put("date", SimpleDateFormat("MMM d, hh:mm a", Locale.getDefault()).format(Date()))
                          })
                          saveStickyNotes(arr)
                          noteInput.setText("")
                          refreshNotes()
                      }
                  }

                  refreshNotes()
                  workspaceContainer.addView(scroll)
              }

              // =========================================================================
              // PERSISTENCE & UI HELPERS
              // =========================================================================
              private fun getTodoList(): JSONArray {
                  val raw = getSharedPreferences("m365_prefs", Context.MODE_PRIVATE).getString("todo_items", "[]") ?: "[]"
                  return JSONArray(raw)
              }

              private fun saveTodoList(arr: JSONArray) {
                  getSharedPreferences("m365_prefs", Context.MODE_PRIVATE).edit().putString("todo_items", arr.toString()).apply()
              }

              private fun getStickyNotes(): JSONArray {
                  val raw = getSharedPreferences("m365_prefs", Context.MODE_PRIVATE).getString("sticky_notes", "[]") ?: "[]"
                  return JSONArray(raw)
              }

              private fun saveStickyNotes(arr: JSONArray) {
                  getSharedPreferences("m365_prefs", Context.MODE_PRIVATE).edit().putString("sticky_notes", arr.toString()).apply()
              }

              private fun getRecentFiles(): JSONArray {
                  val raw = getSharedPreferences("m365_prefs", Context.MODE_PRIVATE).getString("recent_files", "[]") ?: "[]"
                  return JSONArray(raw)
              }

              private fun recordRecentFile(name: String, type: String) {
                  val prefs = getSharedPreferences("m365_prefs", Context.MODE_PRIVATE)
                  val arr = JSONArray(prefs.getString("recent_files", "[]") ?: "[]")
                  val next = JSONArray()
                  next.put(JSONObject().apply {
                      put("name", name)
                      put("type", type)
                      put("date", SimpleDateFormat("MMM d, hh:mm a", Locale.getDefault()).format(Date()))
                  })
                  for (i in 0 until minOf(arr.length(), 4)) {
                      val prev = arr.getJSONObject(i)
                      if (prev.getString("name") != name) next.put(prev)
                  }
                  prefs.edit().putString("recent_files", next.toString()).apply()
              }

              private fun colLetter(index: Int): String {
                  var n = index
                  var sb = ""
                  while (n >= 0) {
                      sb = ('A' + (n % 26)) + sb
                      n = (n / 26) - 1
                  }
                  return sb
              }

