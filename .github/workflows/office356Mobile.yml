              private fun navigateTo(target: ScreenState, pushHistory: Boolean = true) {
                  if (target == ScreenState.EDITOR && currentFile == null) {
                      showCreateMenuWithTemplates()
                      return
                  }
                  if (pushHistory && currentScreen != target) {
                      navHistory.addLast(currentScreen)
                  }
                  currentScreen = target
                  renderScreen(target)
              }

              private fun handleBackNavigation() {
                  // 1. If in PowerPoint full-screen presentation mode, exit presentation mode first
                  if (currentScreen == ScreenState.EDITOR && isPresentationMode && currentFile != null) {
                      isPresentationMode = false
                      renderPowerPointEditor(currentFile!!)
                      return
                  }
                  // 2. Pop previous screen from history stack
                  if (navHistory.isNotEmpty()) {
                      val prev = navHistory.removeLast()
                      currentScreen = prev
                      renderScreen(prev)
                      return
                  }
                  // 3. If on any sub-screen with empty stack, go back to Home instead of exiting app
                  if (currentScreen != ScreenState.HOME) {
                      currentScreen = ScreenState.HOME
                      renderScreen(ScreenState.HOME)
                      return
                  }
                  // 4. Already on Home screen: move task to back cleanly
                  moveTaskToBack(true)
              }

