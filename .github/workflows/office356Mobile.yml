                      setTextColor(textDark)
                      setBackgroundColor(Color.TRANSPARENT)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener { onClick() }
                  }
              }

              private fun appTile(icon: String, title: String, subtitle: String, accent: Int, onClick: () -> Unit): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(22, 22, 22, 22)
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 20f
                          setStroke(2, borderSubtle)
                      }
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginEnd = 10
                          marginStart = 6
                      }
                      addView(TextView(this@MainActivity).apply {
                          text = icon
                          textSize = 26f
                      })
                      addView(TextView(this@MainActivity).apply {
                          text = title
                          textSize = 16f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(accent)
                          setPadding(0, 8, 0, 2)
                      })
                      addView(TextView(this@MainActivity).apply {
                          text = subtitle
                          textSize = 12f
                          setTextColor(textMuted)
                      })
                      setOnClickListener { onClick() }
                  }
              }

              private fun m365Card(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(28, 24, 28, 24)
                      background = GradientDrawable().apply {
                          setColor(cardWhite)
                          cornerRadius = 20f
                          setStroke(2, borderSubtle)
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = 20 }
                  }
              }
          }

          class SignatureDrawView(context: Context) : View(context) {
              private val path = Path()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#1E3A8A")
                  strokeWidth = 7f
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
                  strokeCap = Paint.Cap.ROUND
              }

              init {
                  setBackgroundColor(Color.parseColor("#F8FAFC"))
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> path.moveTo(event.x, event.y)
                      MotionEvent.ACTION_MOVE -> path.lineTo(event.x, event.y)
                  }
                  invalidate()
                  return true
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawPath(path, paint)
              }

              fun exportBitmap(): Bitmap {
                  val bmp = Bitmap.createBitmap(maxOf(width, 400), maxOf(height, 200), Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  c.drawColor(Color.TRANSPARENT)
                  c.drawPath(path, paint)
                  return bmp
              }
          }
          EOF

