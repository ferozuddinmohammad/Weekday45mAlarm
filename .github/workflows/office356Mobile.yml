                      })
                      resumeCard.addView(TextView(this).apply {
                          text = "Tap to return to your active document workspace"
                          textSize = 12f
                          setTextColor(textMuted)
                          setPadding(0, 4, 0, 10)
                      })
                      resumeCard.setOnClickListener { loadIntoEditor(active, pushHistory = true) }
                      col.addView(resumeCard)
                  }

                  val dynamicFeed = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(dynamicFeed)

                  fun renderFeed(filter: String) {
                      dynamicFeed.removeAllViews()
                      val q = filter.trim().lowercase()

                      // To Do Card
                      val todoCard = m365Card()
                      todoCard.addView(TextView(this).apply {
                          text = "☑️ Microsoft To Do (Saved on Phone)"
                          textSize = 16f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(todoBlue)
                      })
                      val tasks = getTodoList()
                      var shownTasks = 0
                      for (i in 0 until tasks.length()) {
                          val t = tasks.getJSONObject(i)
                          val title = t.getString("title")
                          if (q.isEmpty() || title.lowercase().contains(q)) {
                              if (shownTasks < 3) {
                                  val mark = if (t.optBoolean("done", false)) "✔" else "○"
                                  todoCard.addView(TextView(this).apply {
                                      text = "$mark  $title"
                                      textSize = 14f
                                      setTextColor(textDark)
                                      setPadding(0, 8, 0, 4)
                                  })
                              }
                              shownTasks++
                          }
                      }
                      if (shownTasks == 0) {
                          todoCard.addView(TextView(this).apply {
                              text = "No matching tasks. Tap below to manage your To Do list."
                              textSize = 13f
                              setTextColor(textMuted)
                              setPadding(0, 8, 0, 8)
                          })
                      }
                      todoCard.addView(Button(this).apply {
                          text = "Open To Do List ($shownTasks) →"
                          setBackgroundColor(todoBlue)
                          setTextColor(Color.WHITE)
                          setOnClickListener { navigateTo(ScreenState.TODO) }
                      })
                      dynamicFeed.addView(todoCard)

                      // Sticky Notes Card
                      val notesCard = m365Card().apply {
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#FEFCE8"))
                              cornerRadius = 20f
                              setStroke(2, Color.parseColor("#FACC15"))
                          }
                      }
                      notesCard.addView(TextView(this).apply {
                          text = "🗒️ Sticky Notes"
                          textSize = 16f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.parseColor("#854D0E"))
                      })
                      val notes = getStickyNotes()
                      var shownNotes = 0
                      for (i in 0 until notes.length()) {
                          val n = notes.getJSONObject(i)
                          val body = n.getString("body")
                          if (q.isEmpty() || body.lowercase().contains(q)) {
                              if (shownNotes < 2) {
                                  notesCard.addView(TextView(this).apply {
                                      text = "• ${body.take(80)}"
                                      textSize = 13f
                                      setTextColor(textDark)
                                      setPadding(0, 6, 0, 4)
                                  })
                              }
                              shownNotes++
                          }
                      }
                      notesCard.addView(Button(this).apply {
                          text = "Open Sticky Notes ($shownNotes) →"
                          setBackgroundColor(Color.parseColor("#CA8A04"))
                          setTextColor(Color.WHITE)
                          setOnClickListener { navigateTo(ScreenState.NOTES) }
                      })
                      dynamicFeed.addView(notesCard)

                      // Recent Files Card
                      val recentArr = getRecentFiles()
                      val recentCard = m365Card()
                      recentCard.addView(TextView(this).apply {
                          text = "🕒 Recent Documents"
                          textSize = 16f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(textDark)
                          setPadding(0, 0, 0, 8)
                      })
                      var shownRecents = 0
                      for (i in 0 until recentArr.length()) {
                          val item = recentArr.getJSONObject(i)
                          val rName = item.getString("name")
                          if (q.isEmpty() || rName.lowercase().contains(q)) {
                              recentCard.addView(TextView(this).apply {
                                  text = "• $rName (${item.getString("date")})"
                                  textSize = 13f
                                  setTextColor(textMuted)
                                  setPadding(0, 6, 0, 6)
                              })
                              shownRecents++
                          }
                      }
                      if (shownRecents == 0) {
                          recentCard.addView(TextView(this).apply {
                              text = "Tap '📂 Open' above to open .doc, .docx, .xls, .xlsx, .ppt, .pptx, or .pdf files."
                              textSize = 13f
                              setTextColor(textMuted)
                          })
                      }
                      dynamicFeed.addView(recentCard)
                  }

                  searchBox.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          homeFilterQuery = s?.toString() ?: ""
                          renderFeed(homeFilterQuery)
                      }
                  })

                  renderFeed(homeFilterQuery)
                  workspaceContainer.addView(scroll)
              }

